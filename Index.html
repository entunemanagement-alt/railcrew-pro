<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Pro Planner</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b1a2a;
    color:white;
    padding:15px;
}
h1 {border-bottom:2px solid red;padding-bottom:5px;}
.card {
    background:#13233d;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}
input, select {
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:6px;
    border:none;
}
button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    background:red;
    color:white;
    font-weight:bold;
}
.job {
    background:#1e293b;
    padding:10px;
    border-left:4px solid red;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>RailCrew Pro Planner</h1>

<div class="card">
    <h3>Add Job</h3>
    <input id="train" placeholder="Train #">
    <input id="route" placeholder="Route">
    <input type="time" id="start">
    <input type="time" id="end">
    <select id="status">
        <option>Planned</option>
        <option>Active</option>
        <option>Done</option>
    </select>
    <button onclick="addJob()">Add Job</button>
</div>

<div class="card">
    <h3>Today's Jobs</h3>
    <div id="list"></div>
</div>

<script>
let jobs = JSON.parse(localStorage.getItem('jobs') || '[]');

function save(){
    localStorage.setItem('jobs', JSON.stringify(jobs));
}

function addJob(){
    const train = document.getElementById('train').value;
    const start = document.getElementById('start').value;
    const end = document.getElementById('end').value;

    if(!train || !start || !end){
        alert("Fill required fields");
        return;
    }

    jobs.push({
        id: Date.now(),
        train,
        route: document.getElementById('route').value,
        start,
        end,
        status: document.getElementById('status').value
    });

    save();
    render();
}

function deleteJob(id){
    jobs = jobs.filter(j => j.id !== id);
    save();
    render();
}

function render(){
    const list = document.getElementById('list');
    list.innerHTML = "";

    jobs.forEach(j=>{
        const div = document.createElement('div');
        div.className = "job";
        div.innerHTML = `
            <b>Train ${j.train}</b> (${j.status})<br>
            ${j.route}<br>
            ${j.start} - ${j.end}
            <button onclick="deleteJob(${j.id})" style="background:#444;margin-top:5px;">Delete</button>
        `;
        list.appendChild(div);
    });
}

render();
</script>

</body>
</html>
