<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RailCrew Pro Master</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg: #0b1a2a; --card: #13233d; --text: #ffffff; --accent: #dc2626;
            --input: #1e293b; --muted: #94a3b8; --success: #10b981; --blue: #2563eb;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; margin: 0; padding-bottom: 50px; }
        
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { margin: 0 0 10px 0; border-bottom: 1px solid #334155; padding-bottom: 5px; color: var(--text); }
        
        .grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        
        label { display: block; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; font-weight: bold; margin-top: 8px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: var(--input); color: white; font-size: 16px; }
        
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; color: white; transition: 0.2s; }
        .btn-main { background: var(--accent); }
        .btn-blue { background: var(--blue); }
        .btn-sec { background: #4b5563; font-size: 0.8rem; }
        
        .guarantee-bar { background: #1e293b; height: 12px; border-radius: 6px; margin-top: 10px; overflow: hidden; }
        .progress { background: var(--success); height: 100%; width: 0%; transition: 0.5s; }
        
        .stats-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: var(--success); }
        
        .pay-summary { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); padding: 15px; border-radius: 8px; margin-top: 10px; text-align: center; }

        /* Countdown Style */
        #countdownBox { background: #000; border: 2px solid var(--blue); padding: 15px; border-radius: 10px; margin-top: 10px; text-align: center; display: none; }
        #timer { font-family: 'Courier New', monospace; font-size: 2.2rem; color: var(--blue); font-weight: bold; display: block; }
        .live-label { color: var(--blue); font-size: 0.7rem; letter-spacing: 1px; font-weight: bold; }
        .manual-input { margin-top: 10px; display: flex; gap: 5px; align-items: center; }

        .leg-item { border-left: 4px solid var(--accent); background: var(--input); padding: 12px; margin-bottom: 10px; border-radius: 4px; position: relative; }
        .delete-btn { position: absolute; top: 10px; right: 10px; color: #ef4444; background: none; border: none; font-size: 1.2rem; cursor: pointer; width: auto; padding: 0; }
        .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; background: var(--blue); color: white; }
    </style>
</head>
<body>

<div class="card">
    <h2>Payroll Hub</h2>
    <div class="grid">
        <div><label>Hourly Rate ($)</label><input type="number" id="hourlyRate" value="45.00" oninput="updateUI()"></div>
        <div style="text-align: right;"><label>Status</label><div id="guaranteeStatus" style="font-weight: bold; margin-top:10px;">QUALIFIED</div></div>
    </div>

    <div class="guarantee-bar"><div id="progressBar" class="progress"></div></div>
    
    <div class="stats-row">
        <div><label>Actual Hrs</label><div id="totalActualHrs" class="stat-val">0.00</div></div>
        <div><label>OT Hrs (1.5x)</label><div id="totalOtHrs" class="stat-val" style="color: var(--warning);">0.00</div></div>
    </div>

    <div class="pay-summary">
        <label>Estimated Gross Pay</label>
        <div id="estPay" style="font-size: 2rem; font-weight: bold;">$0.00</div>
        <small id="payBreakdown" style="color: var(--muted);"></small>
    </div>
    
    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: none; margin-top: 15px;">
        <input type="checkbox" id="breakGuarantee" style="width: auto;" onchange="toggleGuarantee()"> 
        <span>Guarantee Broken (Sick/Leave/Unpaid)</span>
    </label>
</div>

<div class="card" style="border: 1px solid var(--blue);">
    <h3>Arrival Tracker</h3>
    <div class="grid">
        <div><label>Train #</label><input type="number" id="trackTrain" placeholder="e.g. 52"></div>
        <div><button class="btn-blue" onclick="startLiveTrack()">Fetch Live</button></div>
    </div>
    
    <div class="manual-input">
        <input type="time" id="manualTime" style="flex: 2;">
        <button class="btn-sec" onclick="setManualCountdown()" style="flex: 1; margin: 0;">Set Manual</button>
    </div>

    <div id="countdownBox">
        <div class="live-label" id="timerMode">LIVE COUNTDOWN</div>
        <div id="targetStation" style="font-size: 0.9rem; margin: 5px 0;">--</div>
        <span id="timer">00:00:00</span>
        <div id="liveStatus" style="font-size: 0.75rem; color: var(--muted);">Standby</div>
    </div>
</div>

<div class="card">
    <h3>Add Work Leg</h3>
    <div class="grid">
        <div><label>Train #</label><input type="number" id="train"></div>
        <div><label>Date</label><input type="date" id="date"></div>
    </div>
    <div class="grid">
        <div><label>Report Time</label><input type="time" id="report"></div>
        <div><label>Final Time (Off)</label><input type="time" id="actOff" style="border-color: var(--blue);"></div>
    </div>
    <button class="btn-main" onclick="addLeg()">Save to Ledger</button>
</div>

<div class="card">
    <h3>Monthly Ledger</h3>
    <div id="ledgerList"></div>
    <button class="btn-sec" onclick="clearData()">Clear All Data</button>
</div>

<script>
    let ledger = JSON.parse(localStorage.getItem('rcp_master_ledger')) || [];
    let isBroken = JSON.parse(localStorage.getItem('rcp_master_broken')) || false;
    let timerInterval = null;

    // --- PAYROLL CORE ---
    function save() {
        localStorage.setItem('rcp_master_ledger', JSON.stringify(ledger));
        localStorage.setItem('rcp_master_broken', JSON.stringify(isBroken));
        localStorage.setItem('rcp_master_rate', document.getElementById('hourlyRate').value);
    }

    function calculateHours(start, end) {
        if (!start || !end) return 0;
        let [sH, sM] = start.split(':').map(Number);
        let [eH, eM] = end.split(':').map(Number);
        let diff = (eH * 60 + eM) - (sH * 60 + sM);
        if (diff < 0) diff += 1440; 
        return diff / 60;
    }

    function addLeg() {
        const train = document.getElementById('train').value;
        const date = document.getElementById('date').value;
        const report = document.getElementById('report').value;
        const actOff = document.getElementById('actOff').value;
        if (!train || !report || !actOff) return alert("Fill in Train, Report, and Final Time.");
        ledger.push({ id: Date.now(), train, date, report, actOff });
        save(); updateUI();
        ['train', 'report', 'actOff'].forEach(id => document.getElementById(id).value = '');
    }

    function toggleGuarantee() { isBroken = document.getElementById('breakGuarantee').checked; save(); updateUI(); }

    function updateUI() {
        const rate = parseFloat(document.getElementById('hourlyRate').value) || 0;
        const list = document.getElementById('ledgerList');
        list.innerHTML = '';
        let actualWorked = 0;
        
        ledger.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(leg => {
            const hrs = calculateHours(leg.report, leg.actOff);
            actualWorked += hrs;
            const div = document.createElement('div');
            div.className = 'leg-item';
            div.innerHTML = `<button class="delete-btn" onclick="deleteLeg(${leg.id})">×</button>
                <strong>#${leg.train}</strong> | <small>${leg.date}</small>
                <div style="font-size: 0.85rem; margin-top:5px;">${leg.report} → ${leg.actOff} <span class="badge">${hrs.toFixed(2)} Hrs</span></div>`;
            list.appendChild(div);
        });

        let paidStraight = isBroken ? Math.min(actualWorked, 186) : Math.max(185, Math.min(actualWorked, 186));
        let paidOt = Math.max(0, actualWorked - 186);
        let totalPay = (paidStraight * rate) + (paidOt * (rate * 1.5));

        document.getElementById('totalActualHrs').innerText = actualWorked.toFixed(2);
        document.getElementById('totalOtHrs').innerText = paidOt.toFixed(2);
        document.getElementById('estPay').innerText = `$${totalPay.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('payBreakdown').innerText = `${paidStraight.toFixed(2)}h @ Straight + ${paidOt.toFixed(2)}h @ 1.5x`;
        document.getElementById('progressBar').style.width = Math.min((actualWorked / 185) * 100, 100) + "%";
        document.getElementById('guaranteeStatus').innerText = isBroken ? "BROKEN" : "QUALIFIED";
        document.getElementById('guaranteeStatus').style.color = isBroken ? "var(--accent)" : "var(--success)";
    }

    function deleteLeg(id) { ledger = ledger.filter(l => l.id !== id); save(); updateUI(); }
    function clearData() { if(confirm("Clear month?")) { ledger = []; isBroken = false; save(); updateUI(); } }

    // --- COUNTDOWN LOGIC ---
    function runTimer(targetTime, label) {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('countdownBox').style.display = 'block';
        document.getElementById('timerMode').innerText = label;

        timerInterval = setInterval(() => {
            const now = new Date().getTime();
            const diff = targetTime - now;
            
            if (diff < 0) {
                document.getElementById('timer').innerText = "ARRIVED";
                clearInterval(timerInterval);
                return;
            }

            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer').innerText = `${h > 0 ? h + ':' : ''}${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
        }, 1000);
    }

    async function startLiveTrack() {
        const num = document.getElementById('trackTrain').value;
        if (!num) return alert("Enter train number");
        document.getElementById('liveStatus').innerText = "Fetching data...";
        
        try {
            const resp = await fetch(`https://api-v3.amtraker.com/v3/trains/${num}`);
            const data = await resp.json();
            const train = data[num][0];
            const nextStop = train.stations.find(s => !s.postArr);
            
            if (!nextStop) throw new Error("No data");
            
            document.getElementById('targetStation').innerText = nextStop.name;
            document.getElementById('liveStatus').innerText = `${train.trainTimely} • ${train.velocity} MPH`;
            const arrival = new Date(nextStop.estArr || nextStop.schArr).getTime();
            runTimer(arrival, "LIVE COUNTDOWN");
        } catch (e) {
            document.getElementById('liveStatus').innerText = "Fetch failed. Use Manual Set.";
        }
    }

    function setManualCountdown() {
        const timeVal = document.getElementById('manualTime').value;
        if (!timeVal) return alert("Select a time first");
        
        const [h, m] = timeVal.split(':');
        const target = new Date();
        target.setHours(h, m, 0, 0);
        
        // If time is in the past, assume it's for tomorrow
        if (target.getTime() < new Date().getTime()) {
            target.setDate(target.getDate() + 1);
        }

        document.getElementById('targetStation').innerText = "Manual Destination";
        document.getElementById('liveStatus').innerText = "Manual Override Active";
        runTimer(target.getTime(), "MANUAL COUNTDOWN");
    }

    // Init
    document.getElementById('date').valueAsDate = new Date();
    const savedRate = localStorage.getItem('rcp_master_rate');
    if (savedRate) document.getElementById('hourlyRate').value = savedRate;
    updateUI();
</script>
</body>
</html>
