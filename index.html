<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Pro v41</title>
<style>
body{font-family:Arial;background:#0b1830;color:white;margin:0;padding:15px}
.card{background:#13233d;padding:15px;border-radius:15px;margin-bottom:15px}
h2{margin:0 0 10px}
button{padding:10px;border:none;border-radius:10px;margin:5px}
.green{background:#16a34a;color:white}
.blue{background:#2563eb;color:white}
.red{background:#dc2626;color:white}
input{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none}
</style>
</head>
<body>

<div class="card">
<h2>Today's Schedule</h2>
<div id="schedule"></div>
</div>

<div class="card">
<h2>Controls</h2>
<button class="green" onclick="setTime('report')">Start Shift</button>
<button class="blue" onclick="setTime('station')">At Station</button>
<button class="red" onclick="setTime('off')">End Shift</button>
</div>

<div class="card">
<h2>Edit Today</h2>
<label>Report</label><input id="report">
<label>Station</label><input id="station">
<label>Off</label><input id="off">
</div>

<div class="card">
<h2>Meals</h2>
<label><input type="checkbox" id="meal1"> Breakfast</label>
<label><input type="checkbox" id="meal2"> Lunch</label>
<label><input type="checkbox" id="meal3"> Dinner</label>
</div>

<script>
let data = JSON.parse(localStorage.getItem("railcrew")) || {
 legs:[
  {train:"153",route:"NYP→PHL"},
  {train:"140",route:"PHL→NYP"}
 ]
};

function render(){
 let html="";
 data.legs.forEach((l,i)=>{
  html+=`<div>Leg ${i+1}: Train ${l.train} (${l.route})</div>`;
 });
 document.getElementById("schedule").innerHTML=html;
}

function now(){
 let d=new Date();
 return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
}

function setTime(type){
 document.getElementById(type).value=now();
 save();
}

function save(){
 data.report=document.getElementById("report").value;
 data.station=document.getElementById("station").value;
 data.off=document.getElementById("off").value;
 localStorage.setItem("railcrew",JSON.stringify(data));
}

render();
</script>

</body>
</html>
