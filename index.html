<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Pro v41.2</title>
<style>
body{font-family:Arial;background:#0b1830;color:white;margin:0;padding:15px}
.card{background:#13233d;padding:15px;border-radius:15px;margin-bottom:15px}
h2{margin:0 0 10px}
button{padding:10px;border:none;border-radius:10px;margin:5px;font-weight:700}
.green{background:#16a34a;color:white}
.blue{background:#2563eb;color:white}
.red{background:#dc2626;color:white}
.dark{background:#374151;color:white}
input{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none}
.label{font-size:12px;color:#cbd5e1;margin-top:8px}
.leg{background:#0f172a;padding:12px;border-radius:12px;margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1 1 220px}
.small{font-size:13px;color:#cbd5e1}
</style>
</head>
<body>

<div class="card">
<h2>Today's Schedule</h2>
<div id="schedule"></div>
<button class="dark" onclick="addLeg()">+ Add Leg</button>
</div>

<div class="card">
<h2>Quick Controls</h2>
<label class="label">Selected Leg</label>
<input id="selectedLeg" type="number" min="1" value="1">
<button class="green" onclick="setTime('report')">Start Shift</button>
<button class="blue" onclick="setTime('arrival')">At Station</button>
<button class="red" onclick="setTime('final')">Clock Out</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem("railcrew_v41_2")) || {
 legs:[
  {train:"153",route:"NYP→PHL",report:"07:05",arrival:"07:20",off:"11:32",final:""},
  {train:"140",route:"PHL→NYP",report:"11:32",arrival:"11:50",off:"15:51",final:""}
 ]
};

function now(){
 let d=new Date();
 return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

function save(){
 localStorage.setItem("railcrew_v41_2",JSON.stringify(data));
}

function render(){
 let html="";
 data.legs.forEach((l,i)=>{
  html+=`
  <div class="leg">
    <strong>Leg ${i+1}</strong>
    <div class="row">
      <div class="col">
        <div class="label">Train</div>
        <input value="${l.train||""}" onchange="update(${i},'train',this.value)">
      </div>
      <div class="col">
        <div class="label">Route</div>
        <input value="${l.route||""}" onchange="update(${i},'route',this.value)">
      </div>
    </div>

    <div class="row">
      <div class="col">
        <div class="label">Report</div>
        <input type="time" value="${l.report||""}" onchange="update(${i},'report',this.value)">
      </div>
      <div class="col">
        <div class="label">Arrival</div>
        <input type="time" value="${l.arrival||""}" onchange="update(${i},'arrival',this.value)">
      </div>
      <div class="col">
        <div class="label">Scheduled Off</div>
        <input type="time" value="${l.off||""}" onchange="update(${i},'off',this.value)">
      </div>
    </div>

    <div class="row">
      <div class="col">
        <div class="label">Final Clock Out (Actual)</div>
        <input type="time" value="${l.final||""}" onchange="update(${i},'final',this.value)">
      </div>
    </div>

    <button class="red" onclick="removeLeg(${i})">Remove</button>
  </div>
  `;
 });
 document.getElementById("schedule").innerHTML=html;
}

function update(i,f,v){
 data.legs[i][f]=v;
 save();
}

function addLeg(){
 data.legs.push({train:"",route:"",report:"",arrival:"",off:"",final:""});
 save();
 render();
}

function removeLeg(i){
 data.legs.splice(i,1);
 save();
 render();
}

function setTime(type){
 let i = Math.max(0,document.getElementById("selectedLeg").value-1);
 if(!data.legs[i]) return;
 data.legs[i][type]=now();
 save();
 render();
}

render();
</script>

</body>
</html>
