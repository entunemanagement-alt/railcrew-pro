<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Pro Elite</title>

<style>
:root {
  --primary:#00529b;
  --bg:#f4f7f6;
  --text:#333;
}

body {
  font-family:sans-serif;
  background:var(--bg);
  margin:0;
  padding:10px;
}

.container {
  max-width:900px;
  margin:auto;
  background:white;
  padding:15px;
  border-radius:10px;
}

h1 { text-align:center; color:var(--primary); }

.nav {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-bottom:10px;
}

.nav button {
  padding:10px;
  border:none;
  background:#ddd;
  font-weight:bold;
}

.page { display:none; }
.active { display:block; }

.card {
  background:#eef2f3;
  padding:15px;
  margin-bottom:10px;
  border-radius:8px;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.big { font-size:1.5em; font-weight:bold; }

input, select {
  width:100%;
  padding:10px;
  margin:5px 0;
}

button.main {
  width:100%;
  padding:12px;
  background:var(--primary);
  color:white;
  border:none;
}

table {
  width:100%;
  margin-top:10px;
  border-collapse:collapse;
}

td, th {
  padding:8px;
  border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

<h1>RailCrew Pro</h1>

<div class="nav">
  <button onclick="showPage('progress')">Progress</button>
  <button onclick="showPage('today')">Today</button>
  <button onclick="showPage('log')">Log</button>
  <button onclick="showPage('pay')">Pay</button>
</div>

<!-- ================= PROGRESS PAGE ================= -->
<div id="page-progress" class="page active">

<div class="card">
  <div class="big" id="currentMove">No shift</div>
  <div id="currentHint">Add today's shift</div>
</div>

<div class="grid">
  <div class="card">
    <b>Train</b><br>
    <span id="currentTrain">--</span>
  </div>

  <div class="card">
    <b>Next Move In</b><br>
    <span id="nextCountdown">--</span>
  </div>

  <div class="card">
    <b>Final Off In</b><br>
    <span id="finalCountdown">--</span>
  </div>

  <div class="card">
    <b>Final Time</b><br>
    <span id="finalTime">--</span>
  </div>
</div>

</div>

<!-- ================= TODAY PAGE ================= -->
<div id="page-today" class="page">

<label>Date</label>
<input type="date" id="date">

<label>Day Type</label>
<select id="type">
<option>Work</option>
<option>Off</option>
<option>Protected</option>
<option>Company Cancel</option>
</select>

<label>Hours</label>
<input type="number" id="hours">

<label>Train</label>
<input id="train">

<label>Report Time</label>
<input type="time" id="report">

<label>Leave Time</label>
<input type="time" id="leave">

<label>Final Off</label>
<input type="time" id="final">

<label>Final Arrival (if late)</label>
<input type="time" id="arrival">

<button class="main" onclick="save()">Save Entry</button>

</div>

<!-- ================= LOG ================= -->
<div id="page-log" class="page">

<table>
<thead>
<tr>
<th>Date</th>
<th>Train</th>
<th>Hours</th>
</tr>
</thead>
<tbody id="log"></tbody>
</table>

</div>

<!-- ================= PAY ================= -->
<div id="page-pay" class="page">

<div class="card">
Total Hours: <span id="totalHours">0</span><br>
Est Pay: <span id="pay">$0</span><br>
OT Hours: <span id="ot">0</span>
</div>

</div>

</div>

<script>
const RATE=26.96;
const GUARANTEE=185;

let shifts=JSON.parse(localStorage.getItem("rcp"))||[];

function showPage(p){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById("page-"+p).classList.add("active");
}

function today(){
 return new Date().toISOString().split("T")[0];
}

function mins(t){
 if(!t)return null;
 let [h,m]=t.split(":").map(Number);
 return h*60+m;
}

function diff(a,b){
 let d=a-b;
 if(d<0)d+=1440;
 return d;
}

function fmt(m){
 if(m==null)return "--";
 return Math.floor(m/60)+"h "+(m%60)+"m";
}

function save(){
 let entry={
  date:date.value,
  type:type.value,
  hours:+hours.value||0,
  train:train.value,
  report:report.value,
  leave:leave.value,
  final:final.value,
  arrival:arrival.value
 };

 let i=shifts.findIndex(s=>s.date==entry.date);
 if(i>=0)shifts[i]=entry;
 else shifts.push(entry);

 localStorage.setItem("rcp",JSON.stringify(shifts));
 render();
}

function render(){
 let tH=0, html="";
 shifts.forEach(s=>{
  tH+=s.hours;
  html+=`<tr><td>${s.date}</td><td>${s.train||"--"}</td><td>${s.hours}</td></tr>`;
 });
 log.innerHTML=html;

 let pay= tH<=GUARANTEE ? GUARANTEE*RATE :
 GUARANTEE*RATE + (tH-185)*RATE*1.5;

 totalHours.innerText=tH.toFixed(2);
 payEl= document.getElementById("pay");
 payEl.innerText="$"+pay.toFixed(2);

 ot.innerText=Math.max(0,tH-186).toFixed(2);

 renderProgress();
}

function renderProgress(){
 let s=shifts.find(x=>x.date==today());
 if(!s || s.type!="Work"){
  currentMove.innerText="Off Day";
  return;
 }

 let now=new Date();
 let nowM=now.getHours()*60+now.getMinutes();

 let r=mins(s.report);
 let l=mins(s.leave);
 let f=mins(s.arrival||s.final);

 let move="";

 if(nowM<r) move="Report Coming";
 else if(nowM<l) move="Board Train";
 else if(nowM<f) move="On Train";
 else move="Done";

 currentMove.innerText=move;
 currentTrain.innerText=s.train||"--";

 if(r) nextCountdown.innerText=fmt(diff(r,nowM));
 if(f){
  finalCountdown.innerText=fmt(diff(f,nowM));
  finalTime.innerText=s.arrival||s.final;
 }
}

render();
setInterval(renderProgress,15000);

date.value=today();
</script>

</body>
</html>
