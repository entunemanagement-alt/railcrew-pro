<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Pro v18 Pro</title>
<style>
body { font-family: Arial; background:#0b0f1a; color:#fff; margin:0; }
.card { background:#111827; padding:20px; margin:15px; border-radius:12px; }
button { padding:12px 16px; border:none; border-radius:8px; margin:5px; cursor:pointer; }
.primary { background:#ef4444; color:white; }
.secondary { background:#374151; color:white; }
input { width:100%; padding:10px; margin:5px 0; border-radius:8px; border:none; }
</style>
</head>
<body>

<div class="card">
<h2>RailCrew Pro v18 Pro</h2>
<p>Fully working build</p>
</div>

<div class="card">
<h3>Live Duty Tracker</h3>
<p id="status">Off Duty</p>
<button class="primary" onclick="startDuty()">Start Duty</button>
<button class="secondary" onclick="endDuty()">End Duty</button>
</div>

<div class="card">
<h3>Quick Actual Update</h3>
<label>Delay Minutes</label>
<input id="delay" type="number" value="0">

<label><input type="checkbox" id="company"> Company removed / canceled</label><br>
<label><input type="checkbox" id="jump"> Jumped to another train</label><br>

<button class="primary" onclick="saveDay()">Save Today</button>
<p id="result"></p>
</div>

<div class="card">
<h3>Live Train Status</h3>
<button onclick="loadTrain()">Load Train</button>
<p id="train"></p>
</div>

<script>
let onDuty = false;

function startDuty(){
  onDuty = true;
  document.getElementById("status").innerText = "On Duty";
}

function endDuty(){
  onDuty = false;
  document.getElementById("status").innerText = "Off Duty";
}

function saveDay(){
  let delay = document.getElementById("delay").value;
  let company = document.getElementById("company").checked;
  let jump = document.getElementById("jump").checked;

  let msg = "Saved. ";

  if(company){
    msg += "Company issue (guarantee protected). ";
  }
  if(jump){
    msg += "Jumped trains recorded. ";
  }
  if(delay > 60){
    msg += "Auto disruption triggered.";
  }

  document.getElementById("result").innerText = msg;
}

function loadTrain(){
  document.getElementById("train").innerText = "Train 140 - On Time (Simulated)";
}
</script>

</body>
</html>
