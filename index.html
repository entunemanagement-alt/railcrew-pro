<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RailCrew Pro v3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg: #0b1a2a; --card: #13233d; --text: #ffffff; --accent: #dc2626;
            --input: #1e293b; --muted: #94a3b8; --success: #10b981; --blue: #2563eb;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; margin: 0; padding-bottom: 50px; }
        
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { margin: 0 0 10px 0; border-bottom: 1px solid #334155; padding-bottom: 5px; color: var(--text); }
        
        .grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        
        label { display: block; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; font-weight: bold; margin-top: 8px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: var(--input); color: white; font-size: 16px; }
        
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; color: white; transition: 0.2s; }
        .btn-main { background: var(--accent); }
        .btn-main:active { filter: brightness(1.2); }
        .btn-sec { background: #4b5563; font-size: 0.8rem; }
        
        .guarantee-bar { background: #1e293b; height: 12px; border-radius: 6px; margin-top: 10px; overflow: hidden; }
        .progress { background: var(--success); height: 100%; width: 0%; transition: 0.5s; }
        
        .stats-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: var(--success); }
        
        .leg-item { border-left: 4px solid var(--accent); background: var(--input); padding: 12px; margin-bottom: 10px; border-radius: 4px; position: relative; }
        .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; vertical-align: middle; }
        .badge-ot { background: var(--warning); color: black; }
        .badge-reg { background: var(--blue); color: white; }
        
        .delete-btn { position: absolute; top: 10px; right: 10px; color: #ef4444; background: none; border: none; font-size: 1.2rem; cursor: pointer; width: auto; padding: 0; }
        .pay-summary { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); padding: 10px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Payroll Hub</h2>
    <div class="grid">
        <div>
            <label>Hourly Rate ($)</label>
            <input type="number" id="hourlyRate" value="45.00" oninput="updateUI()">
        </div>
        <div>
            <label>Guarantee Status</label>
            <div id="guaranteeStatus" style="font-weight: bold; font-size: 0.9rem; margin-top: 12px;">QUALIFIED (185h)</div>
        </div>
    </div>

    <div class="guarantee-bar"><div id="progressBar" class="progress"></div></div>
    
    <div class="stats-row">
        <div><label>Total Actual Hrs</label><div id="totalActualHrs" class="stat-val">0.00</div></div>
        <div><label>OT Hrs (1.5x)</label><div id="totalOtHrs" class="stat-val" style="color: var(--warning);">0.00</div></div>
    </div>

    <div class="pay-summary">
        <label>Est. Gross Earnings</label>
        <div id="estPay" style="font-size: 1.8rem; font-weight: bold;">$0.00</div>
        <small id="payBreakdown" style="color: var(--muted); font-size: 0.75rem;"></small>
    </div>
    
    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: none; margin-top: 15px;">
        <input type="checkbox" id="breakGuarantee" style="width: auto;" onchange="toggleGuarantee()"> 
        <span>Break Guarantee (Sick/Personal/Unpaid)</span>
    </label>
</div>

<div class="card">
    <h3>Add Work Leg</h3>
    <div class="grid">
        <div><label>Train #</label><input type="number" id="train" placeholder="e.g. 175"></div>
        <div><label>Date</label><input type="date" id="date"></div>
    </div>
    <div class="grid">
        <div><label>Report Time</label><input type="time" id="report"></div>
        <div><label>Final Time (Off)</label><input type="time" id="actOff" style="border-color: var(--blue);"></div>
    </div>
    <button class="btn-main" onclick="addLeg()">Add to Monthly Ledger</button>
</div>

<div class="card">
    <h3>Monthly Ledger</h3>
    <div id="ledgerList"></div>
    <button class="btn-sec" onclick="clearData()">Reset All Data</button>
</div>

<script>
    let ledger = JSON.parse(localStorage.getItem('rcp_v3_ledger')) || [];
    let isBroken = JSON.parse(localStorage.getItem('rcp_v3_broken')) || false;
    let rate = parseFloat(localStorage.getItem('rcp_v3_rate')) || 45.00;

    function save() {
        localStorage.setItem('rcp_v3_ledger', JSON.stringify(ledger));
        localStorage.setItem('rcp_v3_broken', JSON.stringify(isBroken));
        localStorage.setItem('rcp_v3_rate', document.getElementById('hourlyRate').value);
    }

    function calculateHours(start, end) {
        if (!start || !end) return 0;
        let [sH, sM] = start.split(':').map(Number);
        let [eH, eM] = end.split(':').map(Number);
        let diff = (eH * 60 + eM) - (sH * 60 + sM);
        if (diff < 0) diff += 1440; 
        return diff / 60;
    }

    function addLeg() {
        const train = document.getElementById('train').value;
        const date = document.getElementById('date').value;
        const report = document.getElementById('report').value;
        const actOff = document.getElementById('actOff').value;

        if (!train || !report || !actOff) return alert("Please fill in Train #, Report, and Final Time.");

        ledger.push({ id: Date.now(), train, date, report, actOff });
        save();
        updateUI();

        document.getElementById('train').value = '';
        document.getElementById('report').value = '';
        document.getElementById('actOff').value = '';
    }

    function deleteLeg(id) {
        ledger = ledger.filter(l => l.id !== id);
        save();
        updateUI();
    }

    function toggleGuarantee() {
        isBroken = document.getElementById('breakGuarantee').checked;
        save();
        updateUI();
    }

    function clearData() {
        if(confirm("Are you sure? This deletes your entire month.")) {
            ledger = [];
            isBroken = false;
            save();
            location.reload();
        }
    }

    function updateUI() {
        const rate = parseFloat(document.getElementById('hourlyRate').value) || 0;
        const list = document.getElementById('ledgerList');
        list.innerHTML = '';
        
        let actualHoursWorked = 0;
        
        ledger.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(leg => {
            const hrs = calculateHours(leg.report, leg.actOff);
            actualHoursWorked += hrs;

            const div = document.createElement('div');
            div.className = 'leg-item';
            div.innerHTML = `
                <button class="delete-btn" onclick="deleteLeg(${leg.id})">×</button>
                <strong>#${leg.train}</strong> | <small>${leg.date}</small>
                <div style="font-size: 0.85rem; margin-top:5px; color: var(--muted);">
                    ${leg.report} → ${leg.actOff} 
                    <span class="badge badge-reg">${hrs.toFixed(2)} Hrs</span>
                </div>
            `;
            list.appendChild(div);
        });

        // Pay Math
        let paidStraightHours = 0;
        let paidOtHours = 0;

        if (isBroken) {
            // Broken Guarantee: Pay actuals
            paidStraightHours = Math.min(actualHoursWorked, 186);
            paidOtHours = Math.max(0, actualHoursWorked - 186);
            document.getElementById('guaranteeStatus').innerText = "BROKEN (Actuals)";
            document.getElementById('guaranteeStatus').style.color = "var(--accent)";
        } else {
            // Qualified: Guarantee 185, OT starts after 186
            paidStraightHours = Math.max(185, Math.min(actualHoursWorked, 186));
            paidOtHours = Math.max(0, actualHoursWorked - 186);
            document.getElementById('guaranteeStatus').innerText = "QUALIFIED (185h Floor)";
            document.getElementById('guaranteeStatus').style.color = "var(--success)";
        }

        const straightPay = paidStraightHours * rate;
        const otPay = paidOtHours * (rate * 1.5);
        const totalGross = straightPay + otPay;

        // Progress Bar
        const progress = Math.min((actualHoursWorked / 185) * 100, 100);
        document.getElementById('progressBar').style.width = progress + "%";
        document.getElementById('progressBar').style.background = actualHoursWorked >= 186 ? "var(--warning)" : "var(--success)";

        // Display
        document.getElementById('totalActualHrs').innerText = actualHoursWorked.toFixed(2);
        document.getElementById('totalOtHrs').innerText = paidOtHours.toFixed(2);
        document.getElementById('estPay').innerText = `$${totalGross.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        document.getElementById('payBreakdown').innerText = `${paidStraightHours.toFixed(2)}h @ Reg + ${paidOtHours.toFixed(2)}h @ 1.5x`;
        document.getElementById('breakGuarantee').checked = isBroken;
        document.getElementById('hourlyRate').value = rate;
    }

    // Default to today
    document.getElementById('date').valueAsDate = new Date();
    updateUI();
</script>
</body>
</html>
