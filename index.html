<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Pro v25 Core</title>
<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff}
.wrap{padding:16px;padding-bottom:100px}
.card{background:#121a2b;border:1px solid #2a3550;border-radius:12px;padding:14px;margin-bottom:14px}
button{padding:10px;border:none;border-radius:8px;background:#ef4444;color:#fff;font-weight:bold}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#0b1220;display:flex}
.tab{flex:1;padding:12px;text-align:center;border-top:1px solid #2a3550;cursor:pointer}
.active{background:#7f1d1d}
.hidden{display:none}
input{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:none}
</style>
</head>
<body>
<div class="wrap">

<div id="home" class="card">
<h2>Home</h2>
<div id="homeContent">No schedule yet</div>
</div>

<div id="builder" class="card hidden">
<h2>Builder</h2>
<label>Train 1</label>
<input id="t1">
<label>Report</label>
<input id="r1" type="time">
<label>Off</label>
<input id="o1" type="time">
<button onclick="saveSchedule()">Save</button>
</div>

<div id="pay" class="card hidden">
<h2>Pay</h2>
<label>Rate</label>
<input id="rate" type="number" value="26.69">
<div id="payOut"></div>
</div>

</div>

<div class="tabbar">
<div class="tab active" onclick="show('home',this)">Home</div>
<div class="tab" onclick="show('builder',this)">Builder</div>
<div class="tab" onclick="show('pay',this)">Pay</div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("rc_v25")||"{}")

function saveSchedule(){
data.t1=document.getElementById("t1").value
data.r1=document.getElementById("r1").value
data.o1=document.getElementById("o1").value
localStorage.setItem("rc_v25",JSON.stringify(data))
renderHome()
}

function renderHome(){
if(!data.t1){document.getElementById("homeContent").innerText="No schedule yet";return}
let hrs=calc(data.r1,data.o1)
document.getElementById("homeContent").innerHTML=
"Train "+data.t1+"<br>"+data.r1+" - "+data.o1+"<br>"+hrs.toFixed(2)+" hrs"
}

function calc(a,b){
if(!a||!b)return 0
let [ah,am]=a.split(":").map(Number)
let [bh,bm]=b.split(":").map(Number)
let s=ah*60+am,e=bh*60+bm
if(e<s)e+=1440
return (e-s)/60
}

function show(id,el){
document.querySelectorAll(".card").forEach(x=>x.classList.add("hidden"))
document.getElementById(id).classList.remove("hidden")
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))
el.classList.add("active")
}

renderHome()
</script>

</body>
</html>
