<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailCrew Pro Planner</title>
    <style>
        :root {
            --bg: #0b1a2a;
            --card: #13233d;
            --accent: #ef4444;
            --planned: #3b82f6;
            --active: #22c55e;
            --done: #64748b;
            --cancelled: #f59e0b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: white;
            padding: 15px;
            line-height: 1.5;
        }

        h1 {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .input-group { margin-bottom: 15px; }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1;
            min-width: 140px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #2d3748;
            background: #1e293b;
            color: white;
            font-size: 1rem;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .secondary-btn {
            background: #334155;
        }

        .warning-btn {
            background: #b45309;
        }

        .job {
            background: #1e293b;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
            position: relative;
        }

        .job.Planned { border-left: 5px solid var(--planned); }
        .job.Active { border-left: 5px solid var(--active); }
        .job.Done { border-left: 5px solid var(--done); opacity: 0.92; }
        .job.Cancelled { border-left: 5px solid var(--cancelled); }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .job-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .job-info {
            color: #cbd5e1;
            font-size: 0.9rem;
            margin: 5px 0;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            white-space: nowrap;
        }

        .job-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .job-actions button {
            width: auto;
            padding: 8px 12px;
            font-size: 0.8rem;
            margin-top: 0;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .summary-box {
            background: #1e293b;
            padding: 14px;
            border-radius: 10px;
        }

        .summary-label {
            color: #94a3b8;
            font-size: 0.8rem;
        }

        .summary-value {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .subtle {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 10px 0;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 700px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>RailCrew Pro</h1>

    <div class="card">
        <div class="section-title">
            <h3 id="formTitle" style="margin:0;">Add New Job</h3>
            <span class="subtle" id="editStatus">New entry</span>
        </div>

        <div class="row">
            <div class="col input-group">
                <label for="jobDate">Job Date</label>
                <input type="date" id="jobDate">
            </div>
            <div class="col input-group">
                <label for="status">Current Status</label>
                <select id="status">
                    <option value="Planned">Planned</option>
                    <option value="Active">Active</option>
                    <option value="Done">Done</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <input id="train" placeholder="Train # (e.g. 2256)">
        </div>

        <div class="input-group">
            <input id="route" placeholder="Route (e.g. NYP -> NHV)">
        </div>

        <div class="row input-group">
            <div class="col">
                <label>Report / On Duty</label>
                <input type="time" id="start">
            </div>
            <div class="col">
                <label>Scheduled Off Duty</label>
                <input type="time" id="end">
            </div>
        </div>

        <div class="row input-group">
            <div class="col">
                <label>Arrival Time</label>
                <input type="time" id="arrival">
            </div>
            <div class="col">
                <label>Actual Off Duty</label>
                <input type="time" id="actualEnd">
            </div>
        </div>

        <div class="row input-group">
            <div class="col">
                <label>Meals</label>
                <select id="meals">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <div class="col">
                <label>Hourly Rate</label>
                <input type="number" id="payRate" step="0.01" placeholder="26.69">
            </div>
        </div>

        <div class="input-group">
            <label>Notes</label>
            <textarea id="notes" placeholder="Delay, layover, company cancel, protect job, etc."></textarea>
        </div>

        <button id="saveBtn" onclick="saveJob()">Add to Schedule</button>
        <button class="secondary-btn" onclick="clearForm()">Clear Form</button>
    </div>

    <div class="card">
        <div class="section-title">
            <h3 style="margin:0;">Day View</h3>
            <div style="min-width:180px;">
                <label for="filterDate">Show Date</label>
                <input type="date" id="filterDate" onchange="render()">
            </div>
        </div>

        <div class="summary-grid" style="margin-top:12px;">
            <div class="summary-box">
                <div class="summary-label">Scheduled Hours</div>
                <div class="summary-value" id="dayScheduled">0.00</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">Actual Hours</div>
                <div class="summary-value" id="dayActual">0.00</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">Meal Pay</div>
                <div class="summary-value" id="dayMealPay">$0.00</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">Estimated Day Pay</div>
                <div class="summary-value" id="dayPay">$0.00</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <h3 style="margin:0;">Month Summary</h3>
            <div style="min-width:180px;">
                <label for="filterMonth">Show Month</label>
                <input type="month" id="filterMonth" onchange="render()">
            </div>
        </div>

        <div class="summary-grid" style="margin-top:12px;">
            <div class="summary-box">
                <div class="summary-label">Month Actual Hours</div>
                <div class="summary-value" id="monthHours">0.00</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">Guarantee Progress</div>
                <div class="summary-value" id="guaranteeProgress">0 / 185</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">Overtime Hours</div>
                <div class="summary-value" id="overtimeHours">0.00</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">Estimated Month Pay</div>
                <div class="summary-value" id="monthPay">$0.00</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">
            <h3 style="margin:0;">Schedule</h3>
            <button class="secondary-btn" style="width:auto; padding:10px 14px; margin-top:0;" onclick="exportJobs()">Export Backup</button>
        </div>
        <div id="list"></div>
    </div>

    <script>
        const STORAGE_KEY = 'railcrew_jobs_v2';
        const RATE_KEY = 'railcrew_default_rate';
        let jobs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        let editingId = null;

        function todayISO() {
            const now = new Date();
            const offset = now.getTimezoneOffset();
            const local = new Date(now.getTime() - offset * 60000);
            return local.toISOString().split('T')[0];
        }

        function monthISO(dateStr = todayISO()) {
            return dateStr.slice(0, 7);
        }

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(jobs));
            localStorage.setItem(RATE_KEY, document.getElementById('payRate').value || '26.69');
        }

        function minutesFromTime(t) {
            if (!t) return null;
            const [h, m] = t.split(':').map(Number);
            return (h * 60) + m;
        }

        function getHoursDecimal(start, end) {
            const s = minutesFromTime(start);
            const e = minutesFromTime(end);
            if (s === null || e === null) return 0;
            let diff = e - s;
            if (diff < 0) diff += 1440;
            return diff / 60;
        }

        function getDuration(start, end) {
            const hours = getHoursDecimal(start, end);
            const totalMinutes = Math.round(hours * 60);
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            return `${h}h ${m}m`;
        }

        function money(value) {
            return `$${Number(value || 0).toFixed(2)}`;
        }

        function getMealPay(meals) {
            meals = Number(meals || 0);
            if (meals === 1) return 20;
            if (meals >= 2) return 30;
            return 0;
        }

        function setDefaults() {
            document.getElementById('jobDate').value = todayISO();
            document.getElementById('filterDate').value = todayISO();
            document.getElementById('filterMonth').value = monthISO();
            document.getElementById('payRate').value = localStorage.getItem(RATE_KEY) || '26.69';
        }

        function getFormData() {
            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const actualEnd = document.getElementById('actualEnd').value;

            return {
                id: editingId || Date.now(),
                date: document.getElementById('jobDate').value,
                train: document.getElementById('train').value.trim(),
                route: document.getElementById('route').value.trim() || 'No route specified',
                start,
                end,
                arrival: document.getElementById('arrival').value,
                actualEnd,
                status: document.getElementById('status').value,
                meals: Number(document.getElementById('meals').value || 0),
                payRate: Number(document.getElementById('payRate').value || 0),
                notes: document.getElementById('notes').value.trim(),
                scheduledHours: getHoursDecimal(start, end),
                actualHours: getHoursDecimal(start, actualEnd || end),
                mealPay: getMealPay(document.getElementById('meals').value)
            };
        }

        function saveJob() {
            const data = getFormData();

            if (!data.date || !data.train || !data.start || !data.end) {
                alert("Please enter date, train #, on duty, and off duty.");
                return;
            }

            data.estimatedPay = (data.actualHours * data.payRate) + data.mealPay;

            if (editingId) {
                jobs = jobs.map(j => j.id === editingId ? data : j);
            } else {
                jobs.push(data);
            }

            save();
            clearForm(false);
            render();
        }

        function clearForm(resetDate = true) {
            editingId = null;
            document.getElementById('formTitle').textContent = 'Add New Job';
            document.getElementById('editStatus').textContent = 'New entry';
            document.getElementById('saveBtn').textContent = 'Add to Schedule';

            if (resetDate) {
                document.getElementById('jobDate').value = todayISO();
            }

            document.getElementById('train').value = '';
            document.getElementById('route').value = '';
            document.getElementById('start').value = '';
            document.getElementById('end').value = '';
            document.getElementById('arrival').value = '';
            document.getElementById('actualEnd').value = '';
            document.getElementById('status').value = 'Planned';
            document.getElementById('meals').value = '0';
            document.getElementById('notes').value = '';
            document.getElementById('payRate').value = localStorage.getItem(RATE_KEY) || '26.69';
        }

        function editJob(id) {
            const j = jobs.find(job => job.id === id);
            if (!j) return;

            editingId = id;
            document.getElementById('formTitle').textContent = 'Edit Job';
            document.getElementById('editStatus').textContent = `Editing Train ${j.train}`;
            document.getElementById('saveBtn').textContent = 'Update Job';

            document.getElementById('jobDate').value = j.date || todayISO();
            document.getElementById('train').value = j.train || '';
            document.getElementById('route').value = j.route || '';
            document.getElementById('start').value = j.start || '';
            document.getElementById('end').value = j.end || '';
            document.getElementById('arrival').value = j.arrival || '';
            document.getElementById('actualEnd').value = j.actualEnd || '';
            document.getElementById('status').value = j.status || 'Planned';
            document.getElementById('meals').value = String(j.meals || 0);
            document.getElementById('payRate').value = j.payRate || localStorage.getItem(RATE_KEY) || '26.69';
            document.getElementById('notes').value = j.notes || '';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteJob(id) {
            if (confirm("Delete this job?")) {
                jobs = jobs.filter(j => j.id !== id);
                save();
                render();
            }
        }

        function exportJobs() {
            const blob = new Blob([JSON.stringify(jobs, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'railcrew_jobs_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function render() {
            const list = document.getElementById('list');
            const filterDate = document.getElementById('filterDate').value;
            const filterMonth = document.getElementById('filterMonth').value;

            const sortedJobs = [...jobs].sort((a, b) => {
                const aKey = `${a.date || ''} ${a.start || ''}`;
                const bKey = `${b.date || ''} ${b.start || ''}`;
                return aKey.localeCompare(bKey);
            });

            const dayJobs = sortedJobs.filter(j => j.date === filterDate);
            const monthJobs = sortedJobs.filter(j => (j.date || '').startsWith(filterMonth));

            const dayScheduled = dayJobs.reduce((sum, j) => sum + Number(j.scheduledHours || 0), 0);
            const dayActual = dayJobs.reduce((sum, j) => sum + Number(j.actualHours || 0), 0);
            const dayMeal = dayJobs.reduce((sum, j) => sum + Number(j.mealPay || 0), 0);
            const dayPay = dayJobs.reduce((sum, j) => sum + Number(j.estimatedPay || 0), 0);

            const monthHours = monthJobs.reduce((sum, j) => sum + Number(j.actualHours || 0), 0);
            const monthPay = monthJobs.reduce((sum, j) => sum + Number(j.estimatedPay || 0), 0);
            const overtime = Math.max(0, monthHours - 186);

            document.getElementById('dayScheduled').textContent = dayScheduled.toFixed(2);
            document.getElementById('dayActual').textContent = dayActual.toFixed(2);
            document.getElementById('dayMealPay').textContent = money(dayMeal);
            document.getElementById('dayPay').textContent = money(dayPay);

            document.getElementById('monthHours').textContent = monthHours.toFixed(2);
            document.getElementById('guaranteeProgress').textContent = `${monthHours.toFixed(2)} / 185`;
            document.getElementById('overtimeHours').textContent = overtime.toFixed(2);
            document.getElementById('monthPay').textContent = money(monthPay);

            list.innerHTML = '';

            if (dayJobs.length === 0) {
                list.innerHTML = `<p class="empty">No jobs scheduled for this date.</p>`;
                return;
            }

            dayJobs.forEach(j => {
                const duration = getDuration(j.start, j.end);
                const actualDuration = getDuration(j.start, j.actualEnd || j.end);

                const div = document.createElement('div');
                div.className = `job ${j.status}`;
                div.innerHTML = `
                    <div class="job-header">
                        <span class="job-title">Train ${j.train}</span>
                        <span class="status-badge">${j.status}</span>
                    </div>
                    <div class="job-info">📅 ${j.date}</div>
                    <div class="job-info">📍 ${j.route}</div>
                    <div class="job-info">🕒 Scheduled: ${j.start} - ${j.end} (<b>${duration}</b>)</div>
                    <div class="job-info">✅ Actual: ${j.start} - ${j.actualEnd || j.end} (<b>${actualDuration}</b>)</div>
                    <div class="job-info">🚉 Arrival: ${j.arrival || '--:--'}</div>
                    <div class="job-info">🍽 Meals: ${j.meals || 0} (${money(j.mealPay || 0)})</div>
                    <div class="job-info">💵 Estimated Pay: <b>${money(j.estimatedPay || 0)}</b></div>
                    ${j.notes ? `<div class="job-info">📝 ${j.notes}</div>` : ''}
                    <div class="job-actions">
                        <button class="warning-btn" onclick="editJob(${j.id})">Edit</button>
                        <button class="secondary-btn" onclick="deleteJob(${j.id})">Remove</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        setDefaults();
        render();
    </script>
</body>
</html>
