<!DOCTYPE html>
<html>
<head>
<title>RailCrew Pro v42</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#0b1a2a;color:white;padding:20px}
.card{background:#13233d;padding:15px;border-radius:12px;margin-bottom:10px}
input{width:100%;padding:10px;margin-top:5px;border-radius:8px;border:none}
button{padding:10px;margin-top:10px;border:none;border-radius:8px;background:#dc2626;color:white}
</style>
</head>
<body>

<h2>RailCrew Pro (Manual Train Input)</h2>

<div class="card">
<h3>Add Train Leg</h3>

<label>Train Number (manual)</label>
<input id="train">

<label>Route</label>
<input id="route">

<label>Report Time</label>
<input type="time" id="report">

<label>Arrival Time</label>
<input type="time" id="arrival">

<label>Off Time</label>
<input type="time" id="off">

<button onclick="addLeg()">Add Leg</button>
</div>

<div class="card">
<h3>Schedule</h3>
<div id="list"></div>
</div>

<script>
let legs = [];

function addLeg(){
  const leg = {
    train: document.getElementById("train").value,
    route: document.getElementById("route").value,
    report: document.getElementById("report").value,
    arrival: document.getElementById("arrival").value,
    off: document.getElementById("off").value
  };
  legs.push(leg);
  render();
}

function render(){
  let html="";
  legs.forEach((l,i)=>{
    html+=`<div>Train ${l.train} | ${l.route} | ${l.report}-${l.off}</div>`;
  });
  document.getElementById("list").innerHTML = html;
}
</script>

</body>
</html>
