<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Pro v29.2</title>
<style>
body{font-family:Arial;background:#0b1220;color:white;margin:0;padding:15px}
.card{background:#121a2b;padding:15px;border-radius:12px;margin-bottom:12px}
button{padding:12px 14px;border:none;border-radius:8px;margin:5px;font-weight:700;cursor:pointer}
.red{background:#ef4444;color:white}
.blue{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.gray{background:#e5e7eb;color:#111}
label{display:block;margin:12px 0 6px;font-size:14px}
input[type="time"], input[type="number"]{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #475569;background:#eef2f7;color:#111;box-sizing:border-box}
.checkrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.msg{margin-top:10px;color:#bbf7d0;font-size:14px;min-height:20px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:12px;color:#cbd5e1}
</style>
</head>
<body>

<h2>RailCrew Pro v29.2</h2>

<div class="card">
  <h3>Quick Check</h3>
  <button class="blue" id="amtrakBtn" type="button">Amtrak</button>
  <button class="blue" id="transitBtn" type="button">TransitDocs</button>
</div>

<div class="card">
  <h3>Today</h3>

  <label for="report">Report Time</label>
  <input type="time" id="report">

  <label for="station">Station Time</label>
  <input type="time" id="station">

  <label for="off">Off Time</label>
  <input type="time" id="off">
  <div class="row">
    <button class="green" id="endShiftBtn" type="button">End Shift Now</button>
  </div>
  <div class="small">This fills the Off Time with your phone's current time.</div>

  <label for="delay">Delay (min)</label>
  <input type="number" id="delay" min="0" value="0">

  <div class="msg" id="timeMsg"></div>
</div>

<div class="card">
  <h3>Meals</h3>
  <label class="checkrow"><input type="checkbox" id="breakfast"> Breakfast</label>
  <label class="checkrow"><input type="checkbox" id="lunch"> Lunch</label>
  <label class="checkrow"><input type="checkbox" id="dinner"> Dinner</label>
  <label class="checkrow"><input type="checkbox" id="custom"> Custom Meal</label>
</div>

<div class="card">
  <h3>Actions</h3>
  <button class="red" id="saveBtn" type="button">Save Day</button>
  <button class="gray" id="loadBtn" type="button">Load</button>
  <div class="msg" id="saveMsg"></div>
</div>

<script>
const STORAGE_KEY = "railcrew_v29_2";

function byId(id){ return document.getElementById(id); }

function flash(id, text){
  byId(id).textContent = text;
  setTimeout(() => {
    if (byId(id).textContent === text) byId(id).textContent = "";
  }, 2200);
}

function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function setEndShiftNow(){
  const t = nowHHMM();
  byId("off").value = t;
  flash("timeMsg", "Off time set to " + t);
}

function getFormData(){
  return {
    report: byId("report").value || "",
    station: byId("station").value || "",
    off: byId("off").value || "",
    delay: byId("delay").value || "0",
    meals: {
      breakfast: byId("breakfast").checked,
      lunch: byId("lunch").checked,
      dinner: byId("dinner").checked,
      custom: byId("custom").checked
    }
  };
}

function applyFormData(data){
  byId("report").value = data.report || "";
  byId("station").value = data.station || "";
  byId("off").value = data.off || "";
  byId("delay").value = data.delay || "0";
  const meals = data.meals || {};
  byId("breakfast").checked = !!meals.breakfast;
  byId("lunch").checked = !!meals.lunch;
  byId("dinner").checked = !!meals.dinner;
  byId("custom").checked = !!meals.custom;
}

function saveDay(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(getFormData()));
    flash("saveMsg", "Saved.");
  }catch(e){
    flash("saveMsg", "Save failed.");
  }
}

function loadDay(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      flash("saveMsg", "Nothing saved yet.");
      return;
    }
    applyFormData(JSON.parse(raw));
    flash("saveMsg", "Loaded.");
  }catch(e){
    flash("saveMsg", "Load failed.");
  }
}

byId("endShiftBtn").onclick = setEndShiftNow;
byId("saveBtn").onclick = saveDay;
byId("loadBtn").onclick = loadDay;
byId("amtrakBtn").onclick = function(){ window.open("https://www.amtrak.com/track-your-train.html", "_blank"); };
byId("transitBtn").onclick = function(){ window.open("https://asm.transitdocs.com/", "_blank"); };

// auto-load once on open
loadDay();
</script>

</body>
</html>
