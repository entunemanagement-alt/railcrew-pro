<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Auto Scheduler</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#071321;
    color:white;
    padding:15px;
}
.card {
    background:#13233d;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}
button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#ef4444;
    color:white;
    font-weight:bold;
    margin-top:10px;
}
input {
    width:100%;
    padding:10px;
    border-radius:6px;
    border:none;
}
.day {
    background:#1e293b;
    padding:10px;
    margin-top:10px;
    border-left:5px solid #22c55e;
}
.off {
    border-left:5px solid #64748b;
}
.small {
    color:#94a3b8;
    font-size:12px;
}
</style>
</head>

<body>

<h2>RailCrew Auto Scheduler</h2>

<div class="card">
    <label>Pick Month</label>
    <input type="month" id="month">
    <button onclick="build()">Build Month</button>
</div>

<div class="card">
    <h3>Schedule</h3>
    <div id="list"></div>
</div>

<div class="card">
    <h3>Summary</h3>
    <div id="summary"></div>
</div>

<script>

// 🔥 YOUR PRELOADED WEEKLY SCHEDULE
const template = {
    1: {type:"Work", legs:[
        {train:"0093",route:"NYP-WAS",start:"13:00",end:"17:25"},
        {train:"2124",route:"WAS-NYP",start:"17:25",end:"21:20"}
    ]},
    2: {type:"Work", legs:[
        {train:"0093",route:"NYP-WAS",start:"13:00",end:"17:25"},
        {train:"2124",route:"WAS-NYP",start:"17:25",end:"21:20"}
    ]},
    3: {type:"Work", legs:[
        {train:"0095",route:"NYP-WAS",start:"09:35",end:"14:05"},
        {train:"0148",route:"WAS-NYP",start:"14:05",end:"18:27"}
    ]},
    4: {type:"Work", legs:[
        {train:"0153",route:"NYP-WAS",start:"07:05",end:"11:32"},
        {train:"0140",route:"WAS-NYP",start:"11:32",end:"15:51"}
    ]},
    5: {type:"Work", legs:[
        {train:"0143",route:"NYP-WAS",start:"08:47",end:"13:24"},
        {train:"2258",route:"WAS-NYP",start:"13:24",end:"19:05"}
    ]},
    6: {type:"Off"},
    0: {type:"Off"}
};

function hours(s,e){
    let [sh,sm]=s.split(':').map(Number);
    let [eh,em]=e.split(':').map(Number);
    let diff=(eh*60+em)-(sh*60+sm);
    if(diff<0) diff+=1440;
    return diff/60;
}

function build(){
    const month=document.getElementById('month').value;
    if(!month) return alert("Pick month");

    const [y,m]=month.split('-');
    const days=new Date(y,m,0).getDate();

    let html="";
    let total=0;
    let workDays=0;

    for(let d=1;d<=days;d++){
        const date=new Date(y,m-1,d);
        const wd=date.getDay();
        const day=template[wd];

        if(day.type==="Off"){
            html+=`<div class="day off">
                <b>${date.toDateString()}</b><br>
                OFF
            </div>`;
        } else {
            workDays++;
            let h=0;
            let legsHTML="";

            day.legs.forEach(l=>{
                const hrs=hours(l.start,l.end);
                h+=hrs;
                legsHTML+=`
                    <div class="small">
                        Train ${l.train} | ${l.route}<br>
                        ${l.start}-${l.end} (${hrs.toFixed(2)}h)
                    </div>`;
            });

            total+=h;

            html+=`<div class="day">
                <b>${date.toDateString()}</b><br>
                ${legsHTML}
                <div class="small"><b>${h.toFixed(2)} hrs</b></div>
            </div>`;
        }
    }

    document.getElementById('list').innerHTML=html;

    document.getElementById('summary').innerHTML=`
        Work Days: ${workDays}<br>
        Total Hours: ${total.toFixed(2)}<br>
        Guarantee: ${total>=185?"Met":"Below 185"}
    `;
}

</script>

</body>
</html>
