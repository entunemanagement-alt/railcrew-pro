<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Screenshot Fix</title>
<style>
body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif;padding:16px}
.card{background:#121a2b;border:1px solid #2a3550;border-radius:16px;padding:16px;max-width:900px;margin:0 auto}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #4b5878;background:#eef2f7;color:#111;box-sizing:border-box}
.preview{margin-top:12px;border:1px dashed #4b5878;border-radius:12px;padding:12px;text-align:center;background:rgba(255,255,255,.02)}
.preview img{max-width:100%;max-height:420px;border-radius:10px;display:none;margin:0 auto}
button{margin-top:12px;padding:11px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;background:#ef4444;color:#fff}
.msg{margin-top:12px;color:#cfe1ff}
</style>
</head>
<body>
<div class="card">
  <h1>RailCrew Screenshot Fix Test</h1>
  <p>This build only tests screenshot loading and saving.</p>
  <input id="imageInput" type="file" accept="image/*">
  <div class="preview">
    <img id="previewImg" alt="Schedule preview">
    <div id="previewPlaceholder">No screenshot loaded yet.</div>
  </div>
  <button id="clearBtn">Clear Image</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const KEY = "railcrew_screenshot_fix_only";

function setMessage(t){ document.getElementById("msg").textContent = t; }

function showImage(src){
  const img = document.getElementById("previewImg");
  const ph = document.getElementById("previewPlaceholder");
  img.onload = function(){
    img.style.display = "block";
    ph.style.display = "none";
    setMessage("Screenshot loaded.");
  };
  img.onerror = function(){
    img.style.display = "none";
    ph.style.display = "block";
    setMessage("Image could not be displayed.");
  };
  img.src = src;
}

function loadSaved(){
  const saved = localStorage.getItem(KEY);
  if(saved){ showImage(saved); }
}

document.getElementById("imageInput").addEventListener("change", function(e){
  const file = e.target.files && e.target.files[0];
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const src = ev.target.result;
    localStorage.setItem(KEY, src);
    showImage(src);
  };
  reader.readAsDataURL(file);
});

document.getElementById("clearBtn").addEventListener("click", function(){
  localStorage.removeItem(KEY);
  document.getElementById("previewImg").removeAttribute("src");
  document.getElementById("previewImg").style.display = "none";
  document.getElementById("previewPlaceholder").style.display = "block";
  document.getElementById("imageInput").value = "";
  setMessage("Image cleared.");
});

loadSaved();
</script>
</body>
</html>
