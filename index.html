<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Pro</title>
<style>
body { font-family: Arial; background:black; color:white; text-align:center; padding:20px;}
.card { background:#111; border:1px solid red; border-radius:12px; padding:15px; margin:10px;}
button { background:red; color:white; padding:10px; border:none; border-radius:8px;}
input { padding:8px; width:80%; }
</style>
</head>
<body>
<h1 style="color:red;">RailCrew Pro</h1>
<p>Track your runs, delays, and pay</p>

<div class="card">
<h3>Add Entry</h3>
<input id="hours" placeholder="Hours worked"><br><br>
<button onclick="add()">Add</button>
</div>

<div class="card">
<h3>Total Hours</h3>
<p id="total">0</p>
</div>

<script>
let total = 0;
function add(){
 let h = Number(document.getElementById('hours').value || 0);
 total += h;
 document.getElementById('total').innerText = total.toFixed(2);
}
</script>

</body>
</html>
