<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RailCrew Cycle</title>

<style>
body{background:#071321;color:white;font-family:Arial;padding:15px}
.card{background:#13233d;padding:15px;border-radius:10px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.day{padding:10px;border-left:5px solid #3b82f6;background:#1e293b;border-radius:8px}
.day.Work{border-color:#22c55e}
.day.Off{border-color:#64748b}
input,textarea{width:100%;padding:10px;margin-top:5px;border-radius:6px;border:none;background:#0f172a;color:white}
button{width:100%;padding:10px;margin-top:10px;background:red;border:none;border-radius:6px;color:white}
.small{color:#94a3b8;font-size:.8rem}
</style>

</head>
<body>

<h2>RailCrew Cycle App</h2>

<div class="card">
<label>Pick Up Date (Day 1)</label>
<input type="date" id="pickup">

<label>Month</label>
<input type="month" id="month">

<button onclick="buildCycle()">Build Schedule</button>
</div>

<div class="card">
<h3>Paste Schedule</h3>
<textarea id="paste"></textarea>
<button onclick="importSchedule()">Import</button>
</div>

<div class="card">
<h3>Month View</h3>
<div id="grid" class="grid"></div>
</div>

<div class="card">
<h3>Summary</h3>
<div id="summary"></div>
</div>

<script>
let days=[];

function save(){localStorage.setItem("cycle",JSON.stringify(days))}
function load(){days=JSON.parse(localStorage.getItem("cycle")||"[]")}

function buildCycle(){
let start=new Date(document.getElementById('pickup').value)
let month=document.getElementById('month').value

let [y,m]=month.split('-')
let total=new Date(y,m,0).getDate()

days=[]

for(let i=1;i<=total;i++){
let date=new Date(y,m-1,i)
let diff=Math.floor((date-start)/86400000)
let cycle=((diff%7)+7)%7

let type=(cycle<5)?"Work":"Off"

days.push({
date:date.toISOString().split('T')[0],
type,
legs:[],
hours:0
})
}

save()
render()
}

function importSchedule(){
let lines=document.getElementById('paste').value.split('\n')

lines.forEach(l=>{
let p=l.split('|').map(x=>x.trim())
let day=p[0]
let train=p[1]
let report=p[3]
let release=p[4]

let d=days.find(x=>x.date.endsWith(day.padStart(2,'0')))
if(!d)return

d.type="Work"
d.legs.push({train,report,release})
d.hours+=calc(report,release)
})

save()
render()
}

function calc(s,e){
if(!s||!e)return 0
let [sh,sm]=s.split(':').map(Number)
let [eh,em]=e.split(':').map(Number)
let diff=(eh*60+em)-(sh*60+sm)
if(diff<0)diff+=1440
return diff/60
}

function render(){
let grid=document.getElementById('grid')
grid.innerHTML=""

let total=0

days.forEach(d=>{
total+=d.hours

let div=document.createElement('div')
div.className="day "+(d.type==="Work"?"Work":"Off")

div.innerHTML=`
<b>${d.date}</b><br>
${d.type}<br>
${d.hours.toFixed(2)} hrs
`

grid.appendChild(div)
})

document.getElementById('summary').innerHTML=`
Total Hours: ${total.toFixed(2)}<br>
Guarantee: ${total>=185?"OK":"Short"}
`
}

load()
render()
</script>

</body>
</html>
