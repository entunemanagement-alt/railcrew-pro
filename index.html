<!DOCTYPE html><html>
<head>
    <title>RailCrew Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="RailCrew Pro"><style>
    :root { --bg: #0b1a2a; --card: #13233d; --text: white; --accent: #dc2626; --input: #1e293b; }
    .high-contrast { --bg: #000000; --card: #1a1a1a; --text: #ffffff; --accent: #ff0000; --input: #000000; }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; transition: 0.3s; }
    h2 { border-bottom: 2px solid var(--accent); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    label { display: block; margin-top: 10px; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
    input, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #334155; background: var(--input); color: white; box-sizing: border-box; font-size: 16px; }
    button, .btn-link { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 8px; background: var(--accent); color: white; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; box-sizing: border-box; }
    .btn-link { background: #334155; margin-top: 5px; font-size: 0.8rem; }
    .btn-secondary { background: #4b5563; margin-top: 10px; }
    .btn-live { background: #2563eb; margin-top: 5px; font-size: 0.75rem; padding: 8px; }
    
    .leg-item { border-left: 4px solid var(--accent); background: var(--input); padding: 12px; margin-bottom: 10px; border-radius: 0 8px 8px 0; position: relative; }
    .train-no { font-size: 1.1rem; font-weight: bold; color: var(--accent); }
    .duty-badge { background: #064e3b; color: #6ee7b7; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; float: right; }
    .live-badge { background: #1d4ed8; color: #dbeafe; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; display: inline-block; margin-top: 6px; }
    .notes-text { font-size: 0.85rem; color: #cbd5e1; margin-top: 8px; font-style: italic; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 4px; }
    .delete-btn { position: absolute; top: 10px; right: 10px; color: #64748b; border: none; background: none; font-size: 1.2rem; width: auto; padding: 0; margin: 0; }
    .contrast-toggle { font-size: 0.7rem; background: #334155; padding: 5px 10px; border-radius: 20px; cursor: pointer; }
    .status-line { font-size: 0.82rem; color: #cbd5e1; margin-top: 6px; }
    .muted { color: #94a3b8; font-size: 0.8rem; }
</style>

</head>
<body><h2>
    RailCrew Pro 
    <span class="contrast-toggle" onclick="toggleContrast()">High Contrast</span>
</h2>

<div class="card">
    <h3>Train Tools</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <a href="https://www.amtrak.com/home" target="_blank" class="btn-link">Status</a>
        <a href="https://www.amtrak.com/train-schedules-timetables" target="_blank" class="btn-link">Schedules</a>
    </div>
    <div class="muted" style="margin-top:10px;">Live lookup uses Amtraker data when available.</div>
</div>

<div class="card">
    <h3>Add Leg</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
            <label>Train #</label>
            <input id="train" type="number" placeholder="e.g. 52">
            <button class="btn-live" onclick="fetchLive(this)">Fetch Live Info</button>

            <!-- LIVE TRACK QUICK LINKS -->
            <div id="liveTrack" style="display:none; margin-top:10px; border-top:1px solid #334155; padding-top:10px;">
                <span id="activeTrainLabel" style="color:#6ee7b7; font-weight:bold;"></span>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:5px;">
                    <button id="asmLink" class="btn-link" style="background:#1e40af; margin:0;">ASM Live Map</button>
                    <button id="railRatLink" class="btn-link" style="background:#1e40af; margin:0;">RailRat Text</button>
                </div>
            </div>
        </div>
        <div><label>Route</label><input id="route" placeholder="e.g. BAL-NYP"></div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div><label>Report</label><input type="time" id="report"></div>
        <div><label>Off</label><input type="time" id="off"></div>
    </div>
    <label>Notes (Engines, Delays, etc.)</label>
    <textarea id="notes" rows="2"></textarea>
    <button onclick="addLeg()">Add to Schedule</button>
</div>

<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <h3>Active Schedule</h3>
        <button class="btn-secondary" style="width:auto;margin-top:0;" onclick="toggleAutoLive()" id="autoLiveBtn">Auto Live: Off</button>
    </div>
    <div class="muted">When Auto Live is on, the app refreshes saved trains about every 60 seconds.</div>
    <div id="list"></div>
    <button id="dlBtn" class="btn-secondary" style="display:none; background:#10b981;" onclick="downloadReport()">Download Report</button>
    <button id="clBtn" class="btn-secondary" style="display:none;" onclick="clearAll()">Clear All</button>
</div>

<script>
    let legs = JSON.parse(localStorage.getItem('railLegs')) || [];
    let autoLive = JSON.parse(localStorage.getItem('railAutoLive') || 'false');
    let liveTimer = null;
    render();
    syncAutoLiveUI();
    if (autoLive) startAutoLive();

    function toggleContrast() {
        document.body.classList.toggle('high-contrast');
    }

    function calculateDuty(start, end) {
        if (!start || !end) return "0h 0m";
        let [sH, sM] = start.split(':').map(Number);
        let [eH, eM] = end.split(':').map(Number);
        let diff = (eH * 60 + eM) - (sH * 60 + sM);
        if (diff < 0) diff += 1440; 
        return `${Math.floor(diff/60)}h ${diff%60}m`;
    }

    function saveLegs() {
        localStorage.setItem('railLegs', JSON.stringify(legs));
    }

    function addLeg() {
        const train = document.getElementById('train').value;
        const report = document.getElementById('report').value;
        const off = document.getElementById('off').value;
        if (!train || !report || !off) return alert("Fill in Train # and Times");

        legs.push({
            train,
            report,
            off,
            route: document.getElementById('route').value,
            notes: document.getElementById('notes').value,
            liveStatus: '',
            nextStop: '',
            speed: '',
            lastUpdated: ''
        });
        
        saveLegs();
        document.getElementById('train').value = '';
        document.getElementById('route').value = '';
        document.getElementById('notes').value = '';
        render();
    }

    function clearAll() {
        if(confirm("Clear all?")) {
            legs=[];
            localStorage.removeItem('railLegs');
            render();
        }
    }

    function syncAutoLiveUI() {
        const btn = document.getElementById('autoLiveBtn');
        btn.textContent = `Auto Live: ${autoLive ? 'On' : 'Off'}`;
        btn.style.background = autoLive ? '#2563eb' : '#4b5563';
    }

    function toggleAutoLive() {
        autoLive = !autoLive;
        localStorage.setItem('railAutoLive', JSON.stringify(autoLive));
        syncAutoLiveUI();
        if (autoLive) startAutoLive(); else stopAutoLive();
    }

    function startAutoLive() {
        stopAutoLive();
        refreshAllLive();
        liveTimer = setInterval(refreshAllLive, 60000);
    }

    function stopAutoLive() {
        if (liveTimer) clearInterval(liveTimer);
        liveTimer = null;
    }

    async function fetchLive(btn) {
        const trainNum = document.getElementById('train').value;
        if (!trainNum) return alert("Enter a train number first");

        const oldText = btn.innerText;
        btn.innerText = "Searching...";

        try {
            const info = await fetchTrainData(trainNum);
            if (!info) {
                alert("Train not found or not currently active.");
                return;
            }

            document.getElementById('route').value = info.routeName || document.getElementById('route').value;
            if (info.origSchDep) {
                const timePart = info.origSchDep.split(' ')[1];
                if (timePart) document.getElementById('report').value = timePart.substring(0,5);
            }

            alert(
                `Found ${info.routeName || 'Train ' + trainNum}!

` +
                `Status: ${info.trainTimely || 'N/A'}
` +
                `Next Stop: ${info.nextStop || 'N/A'}
` +
                `Speed: ${info.velocity || 0} MPH`
            );
        } catch (err) {
            alert("Could not connect to live feed.");
        } finally {
            btn.innerText = oldText;
        }
    }

    async function fetchTrainData(trainNum) {
        const response = await fetch(`https://api-v3.amtraker.com/v3/trains/${trainNum}`);
        const data = await response.json();
        if (!data || !data[trainNum] || !data[trainNum].length) return null;

        const info = data[trainNum][0];
        const nextStopObj = info.stations?.find(s => s.status === 'Enroute') || info.stations?.find(s => s.code && !s.postArr) || info.stations?.[0];

        return {
            routeName: info.routeName || '',
            trainTimely: info.trainTimely || '',
            velocity: info.velocity || 0,
            origSchDep: info.origSchDep || '',
            nextStop: nextStopObj?.name || nextStopObj?.code || ''
        };
    }

    async function refreshAllLive() {
        if (!legs.length) return;
        for (let i = 0; i < legs.length; i++) {
            const trainNum = legs[i].train;
            if (!trainNum) continue;
            try {
                const info = await fetchTrainData(trainNum);
                if (info) {
                    legs[i].route = info.routeName || legs[i].route;
                    legs[i].liveStatus = info.trainTimely || '';
                    legs[i].nextStop = info.nextStop || '';
                    legs[i].speed = info.velocity ? `${info.velocity} MPH` : '';
                    legs[i].lastUpdated = new Date().toLocaleTimeString();
                }
            } catch (e) {
                // keep existing values on failure
            }
        }
        saveLegs();
        render();
    }

    function downloadReport() {
        let txt = "RAILCREW REPORT

";
        legs.forEach(l => {
            txt += `Train ${l.train} | ${l.route}
On: ${l.report} Off: ${l.off} | Duty: ${calculateDuty(l.report, l.off)}
`;
            txt += `Live Status: ${l.liveStatus || 'N/A'} | Next Stop: ${l.nextStop || 'N/A'} | Speed: ${l.speed || 'N/A'}
`;
            txt += `Notes: ${l.notes || 'None'}

`;
        });
        const blob = new Blob([txt], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'crew_report.txt';
        a.click();
    }

    function render() {
        const list = document.getElementById('list');
        document.getElementById('dlBtn').style.display = legs.length ? 'block' : 'none';
        document.getElementById('clBtn').style.display = legs.length ? 'block' : 'none';
        
        list.innerHTML = legs.map((l, i) => `
            <div class="leg-item">
                <button class="delete-btn" onclick="legs.splice(${i},1); saveLegs(); render();">×</button>
                <span class="duty-badge">${calculateDuty(l.report, l.off)}</span>
                <div class="train-no">Train ${l.train}</div>
                <div style="font-size:0.8rem">${l.route || ''}</div>
                <div style="font-size:0.8rem; margin-top:4px;"><b>${l.report}</b> to <b>${l.off}</b></div>
                ${l.liveStatus ? `<div class="live-badge">LIVE: ${l.liveStatus}</div>` : ''}
                ${(l.nextStop || l.speed || l.lastUpdated) ? `<div class="status-line">Next: ${l.nextStop || 'N/A'} · Speed: ${l.speed || 'N/A'} · Updated: ${l.lastUpdated || 'N/A'}</div>` : ''}
                ${l.notes ? `<div class="notes-text">${l.notes}</div>` : ''}
            </div>
        `).join('');
    }

    // TRACK INPUT / QUICK TRACK LINK LOGIC
document.getElementById('train').addEventListener('input', handleTrack);

function handleTrack(e) {
    setupTracking(e.target.value);
}

function getMinutes(timeStr) {
    if (!timeStr || !timeStr.includes(':')) return null;
    const [h, m] = timeStr.split(':').map(Number);
    return (h * 60) + m;
}

function getActiveTrainFromSchedule() {
    if (!legs || !legs.length) return '';

    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();

    for (const leg of legs) {
        const report = getMinutes(leg.report);
        const off = getMinutes(leg.off);
        if (report === null || off === null) continue;

        let start = report;
        let end = off;
        let current = currentMinutes;

        if (end < start) {
            end += 1440;
            if (current < start) current += 1440;
        }

        if (current >= start && current <= end) {
            return leg.train || '';
        }
    }

    return legs[0]?.train || '';
}

function setupTracking(num) {
    const trackDiv = document.getElementById('liveTrack');
    const asm = document.getElementById('asmLink');
    const rat = document.getElementById('railRatLink');
    const label = document.getElementById('activeTrainLabel');

    if (num && String(num).length > 0) {
        trackDiv.style.display = 'block';
        label.innerText = 'Track Train #' + num;
        localStorage.setItem('lastTrainTracked', num);
        asm.onclick = () => window.open(`https://asm.transitdocs.com/train/${num}`, '_blank');
        rat.onclick = () => window.open(`https://railrat.net/trains/${num}`, '_blank');
    } else {
        trackDiv.style.display = 'none';
    }
}

function syncActiveTracking() {
    const typedTrain = document.getElementById('train').value;
    if (typedTrain && typedTrain.length > 0) {
        setupTracking(typedTrain);
        return;
    }

    const activeTrain = getActiveTrainFromSchedule();
    if (activeTrain) {
        setupTracking(activeTrain);
    } else {
        setupTracking('');
    }
}

window.addEventListener('load', () => {
    const last = localStorage.getItem('lastTrainTracked');
    const activeTrain = getActiveTrainFromSchedule();
    const trainToUse = activeTrain || last;
    if (trainToUse) {
        document.getElementById('train').value = trainToUse;
        setupTracking(trainToUse);
    }
});

const originalRender = render;
render = function() {
    originalRender();
    syncActiveTracking();
};

render();
</script></body>
</html>
