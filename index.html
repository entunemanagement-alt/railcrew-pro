<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RailCrew Pro v35 NEC Picker</title>
<style>
:root{--bg:#0a1020;--bg2:#0f172a;--card:#111827;--card2:#162033;--line:#293548;--text:#f8fafc;--muted:#9fb0c7;--red:#ef4444;--blue:#2563eb;--green:#16a34a}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 32px}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.grid2,.grid3{display:grid;gap:12px}
.grid2{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:760px){.grid3,.grid2{grid-template-columns:1fr}}
h1,h2,h3,p{margin:0}
.sub{color:var(--muted);font-size:13px;line-height:1.35}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
input,select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #4b5878;background:#eef2f7;color:#111827;font-size:16px}
button{padding:12px 14px;border:none;border-radius:12px;font-weight:700;cursor:pointer}
.btn-red{background:linear-gradient(180deg,#ff5f5f,#d12626);color:white}
.btn-blue{background:linear-gradient(180deg,#60a5fa,#2563eb);color:white}
.btn-green{background:linear-gradient(180deg,#22c55e,#15803d);color:white}
.btn-dark{background:#374151;color:white}
.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(180deg,#ff6464,#bf2020);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;letter-spacing:.04em;box-shadow:0 10px 28px rgba(239,68,68,.28)}
.brand{display:flex;align-items:center;gap:14px}
.pill{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#124a2c;color:#bbf7d0}
.list{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:8px;background:#0f172a}
.item{padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.06);margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.msg{margin-top:10px;color:#bbf7d0;font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--green);color:white;padding:10px 18px;border-radius:999px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.28)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="row">
      <div class="brand">
        <div class="logo">RC</div>
        <div>
          <h1>RailCrew Pro v35 NEC Picker</h1>
          <p class="sub">Search or pick a Northeast Corridor-touching Amtrak train, then copy it or jump out to status tools fast.</p>
        </div>
      </div>
      <span class="pill">NEC Picker</span>
    </div>
  </div>

  <div class="card">
    <h2>Quick Pick</h2>
    <div class="grid3" style="margin-top:12px">
      <div>
        <label>Service</label>
        <select id="serviceSelect"></select>
      </div>
      <div>
        <label>Train Number</label>
        <select id="trainSelect"></select>
      </div>
      <div>
        <label>Search Any Train</label>
        <input id="searchInput" placeholder="Type 153, 2254, 79..." />
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn-green" id="copyBtn" type="button">Copy Train Number</button>
      <button class="btn-blue" id="amtrakBtn" type="button">Open Amtrak Status</button>
      <button class="btn-blue" id="transitBtn" type="button">Open TransitDocs</button>
      <button class="btn-dark" id="resetBtn" type="button">Reset</button>
    </div>
    <div class="msg" id="pickerMsg"></div>
  </div>

  <div class="card">
    <h2>All NEC-Touching Services</h2>
    <p class="sub" style="margin-top:6px">Tap a train number to load it into the picker.</p>
    <div id="serviceList" class="list" style="margin-top:12px"></div>
  </div>
</div>

<script>
const SERVICES = {"Acela": ["887", "2104", "2108", "2121", "2122", "2126", "2150", "2151", "2152", "2153", "2154", "2155", "2159", "2162", "2163", "2167", "2168", "2169", "2170", "2172", "2173", "2174", "2190", "2192", "2193", "2201", "2203", "2205", "2206", "2207", "2214", "2216", "2218", "2220", "2222", "2223", "2224", "2226", "2233", "2247", "2248", "2249", "2250", "2252", "2253", "2254", "2255", "2256", "2257", "2259", "2262", "2263", "2265", "2271", "2274", "2292", "2295"], "Northeast Regional": ["65", "66", "67", "82", "84", "85", "86", "87", "88", "93", "94", "95", "96", "99", "100", "101", "103", "104", "105", "106", "107", "109", "110", "111", "112", "113", "117", "118", "119", "120", "121", "122", "123", "124", "125", "126", "127", "128", "129", "130", "131", "132", "134", "135", "136", "137", "138", "139", "140", "141", "142", "143", "144", "145", "146", "147", "148", "149", "150", "151", "152", "153", "154", "155", "156", "157", "158", "159", "160", "161", "162", "163", "164", "165", "166", "167", "168", "169", "170", "171", "172", "173", "174", "175", "176", "177", "178", "179", "181", "182", "183", "184", "185", "186", "189", "190", "192", "193", "194", "195", "196", "197", "198"], "Keystone Service": ["600", "601", "605", "607", "609", "610", "611", "612", "615", "620", "622", "624", "626", "637", "639", "640", "641", "642", "643", "644", "645", "646", "647", "648", "649", "650", "651", "652", "653", "654", "655", "656", "657", "658", "660", "661", "662", "663", "664", "665", "666", "667", "669", "670", "671", "672", "674"], "Carolinian": ["79", "80"], "Vermonter": ["54", "55", "56", "57"], "Pennsylvanian": ["42", "43"], "Palmetto": ["89", "90"], "Silver Meteor": ["97", "98"], "Silver Star": ["91", "92"], "Crescent": ["19", "20"], "Cardinal": ["50", "51"]};
const ALL_TRAINS = ["19", "20", "42", "43", "50", "51", "54", "55", "56", "57", "65", "66", "67", "79", "80", "82", "84", "85", "86", "87", "88", "89", "90", "91", "92", "93", "94", "95", "96", "97", "98", "99", "100", "101", "103", "104", "105", "106", "107", "109", "110", "111", "112", "113", "117", "118", "119", "120", "121", "122", "123", "124", "125", "126", "127", "128", "129", "130", "131", "132", "134", "135", "136", "137", "138", "139", "140", "141", "142", "143", "144", "145", "146", "147", "148", "149", "150", "151", "152", "153", "154", "155", "156", "157", "158", "159", "160", "161", "162", "163", "164", "165", "166", "167", "168", "169", "170", "171", "172", "173", "174", "175", "176", "177", "178", "179", "181", "182", "183", "184", "185", "186", "189", "190", "192", "193", "194", "195", "196", "197", "198", "600", "601", "605", "607", "609", "610", "611", "612", "615", "620", "622", "624", "626", "637", "639", "640", "641", "642", "643", "644", "645", "646", "647", "648", "649", "650", "651", "652", "653", "654", "655", "656", "657", "658", "660", "661", "662", "663", "664", "665", "666", "667", "669", "670", "671", "672", "674", "887", "2104", "2108", "2121", "2122", "2126", "2150", "2151", "2152", "2153", "2154", "2155", "2159", "2162", "2163", "2167", "2168", "2169", "2170", "2172", "2173", "2174", "2190", "2192", "2193", "2201", "2203", "2205", "2206", "2207", "2214", "2216", "2218", "2220", "2222", "2223", "2224", "2226", "2233", "2247", "2248", "2249", "2250", "2252", "2253", "2254", "2255", "2256", "2257", "2259", "2262", "2263", "2265", "2271", "2274", "2292", "2295"];

const byId = id => document.getElementById(id);

function showToast(msg) {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

function fillServices() {
  const serviceSelect = byId("serviceSelect");
  serviceSelect.innerHTML = "";
  Object.keys(SERVICES).forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    serviceSelect.appendChild(opt);
  });
}

function fillTrains(serviceName, selectedTrain="") {
  const trainSelect = byId("trainSelect");
  trainSelect.innerHTML = "";
  (SERVICES[serviceName] || []).forEach(num => {
    const opt = document.createElement("option");
    opt.value = num;
    opt.textContent = num;
    if (num === selectedTrain) opt.selected = true;
    trainSelect.appendChild(opt);
  });
}

function renderServiceList(filter="") {
  const box = byId("serviceList");
  box.innerHTML = "";
  const term = filter.trim();
  Object.entries(SERVICES).forEach(([service, nums]) => {
    const filtered = term ? nums.filter(n => n.includes(term)) : nums;
    if (!filtered.length) return;
    const group = document.createElement("div");
    group.innerHTML = `<h3>${service}</h3>`;
    filtered.forEach(num => {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `<strong>${num}</strong><span class="sub">${service}</span>`;
      row.onclick = () => selectTrain(service, num);
      group.appendChild(row);
    });
    box.appendChild(group);
  });
  if (!box.innerHTML) {
    box.innerHTML = "<div class='sub'>No matching train numbers.</div>";
  }
}

function selectTrain(service, train) {
  byId("serviceSelect").value = service;
  fillTrains(service, train);
  byId("searchInput").value = train;
  byId("pickerMsg").textContent = `Selected ${service} train ${train}.`;
}

async function copySelected() {
  const train = byId("trainSelect").value || byId("searchInput").value.trim();
  if (!train) {
    byId("pickerMsg").textContent = "Pick a train first.";
    return;
  }
  try {
    await navigator.clipboard.writeText(train);
    byId("pickerMsg").textContent = `Copied train ${train}.`;
    showToast("Train copied");
  } catch {
    byId("pickerMsg").textContent = `Train ${train} selected. Copy may be blocked by your browser.`;
  }
}

function openAmtrak() {
  const train = byId("trainSelect").value || byId("searchInput").value.trim();
  if (train) navigator.clipboard && navigator.clipboard.writeText(train).catch(() => {});
  window.open("https://www.amtrak.com/home", "_blank");
  byId("pickerMsg").textContent = train ? `Opened Amtrak. Train ${train} copied.` : "Opened Amtrak.";
}

function openTransitDocs() {
  const train = byId("trainSelect").value || byId("searchInput").value.trim();
  if (train) navigator.clipboard && navigator.clipboard.writeText(train).catch(() => {});
  window.open("https://asm.transitdocs.com/", "_blank");
  byId("pickerMsg").textContent = train ? `Opened TransitDocs. Train ${train} copied.` : "Opened TransitDocs.";
}

function resetPicker() {
  const first = Object.keys(SERVICES)[0];
  byId("serviceSelect").value = first;
  fillTrains(first);
  byId("searchInput").value = "";
  byId("pickerMsg").textContent = "";
  renderServiceList();
}

byId("serviceSelect").addEventListener("change", e => {
  fillTrains(e.target.value);
  byId("searchInput").value = "";
  renderServiceList();
});

byId("searchInput").addEventListener("input", e => {
  const term = e.target.value.trim();
  if (!term) {
    renderServiceList();
    return;
  }
  let foundService = null;
  Object.entries(SERVICES).forEach(([service, nums]) => {
    if (!foundService && nums.includes(term)) foundService = service;
  });
  if (foundService) {
    selectTrain(foundService, term);
  }
  renderServiceList(term);
});

byId("copyBtn").onclick = copySelected;
byId("amtrakBtn").onclick = openAmtrak;
byId("transitBtn").onclick = openTransitDocs;
byId("resetBtn").onclick = resetPicker;

fillServices();
fillTrains(Object.keys(SERVICES)[0]);
renderServiceList();
</script>
</body>
</html>
