<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RailCrew Pro v2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg: #0b1a2a; --card: #13233d; --text: #ffffff; --accent: #dc2626;
            --input: #1e293b; --muted: #94a3b8; --success: #10b981; --blue: #2563eb;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg); color: var(--text); padding: 15px; margin: 0;
        }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { margin: 0 0 10px 0; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        
        label { display: block; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; font-weight: bold; margin-top: 8px; }
        input, textarea, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: var(--input); color: white; font-size: 16px; }
        
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; color: white; }
        .btn-main { background: var(--accent); }
        .btn-blue { background: var(--blue); }
        .btn-sec { background: #4b5563; }
        
        .guarantee-bar { background: #1e293b; height: 20px; border-radius: 10px; margin-top: 10px; overflow: hidden; position: relative; }
        .progress { background: var(--success); height: 100%; width: 0%; transition: 0.5s; }
        .guarantee-text { font-size: 0.8rem; text-align: center; margin-top: 5px; font-weight: bold; }
        
        .leg-item { border-left: 4px solid var(--accent); background: var(--input); padding: 12px; margin-bottom: 10px; border-radius: 4px; position: relative; }
        .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; }
        .badge-warn { background: var(--warning); color: black; }
        .badge-success { background: var(--success); color: white; }
        
        .delete-btn { position: absolute; top: 5px; right: 5px; color: var(--muted); background: none; width: auto; font-size: 1.2rem; }
        .hidden { display: none; }
        .status-pill { display: inline-block; padding: 4px 8px; border-radius: 20px; font-size: 0.75rem; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Monthly Payroll & Guarantee</h2>
    <div class="grid">
        <div>
            <label>Current Month Hours</label>
            <h3 id="monthlyHours">0.00 / 185</h3>
        </div>
        <div>
            <label>Guarantee Status</label>
            <div id="guaranteeStatus" class="status-pill" style="background: var(--success);">QUALIFIED</div>
        </div>
    </div>
    <div class="guarantee-bar"><div id="progressBar" class="progress"></div></div>
    <p class="guarantee-text" id="statusMsg">185.00 hours remaining to meet guarantee.</p>
    
    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: none;">
        <input type="checkbox" id="breakGuarantee" style="width: auto;" onchange="updateUI()"> 
        <span>I called out sick/personal (Break Guarantee)</span>
    </label>
</div>

<div class="card">
    <h3>Add Work Leg</h3>
    <div class="grid">
        <div><label>Train #</label><input type="number" id="train"></div>
        <div><label>Date</label><input type="date" id="date"></div>
    </div>
    <div class="grid">
        <div><label>Report Time</label><input type="time" id="report"></div>
        <div><label>Scheduled Off</label><input type="time" id="schOff"></div>
    </div>
    <div>
        <label>Actual Off Time (Final Time)</label>
        <input type="time" id="actOff" style="border: 1px solid var(--blue);">
    </div>
    <button class="btn-main" onclick="addLeg()">Add to Ledger</button>
</div>

<div class="card">
    <h3>Monthly Ledger</h3>
    <div id="ledgerList"></div>
    <button class="btn-sec" onclick="clearData()">Reset Month</button>
</div>

<script>
    let ledger = JSON.parse(localStorage.getItem('rcp_ledger')) || [];
    let isBroken = JSON.parse(localStorage.getItem('rcp_broken')) || false;

    function save() {
        localStorage.setItem('rcp_ledger', JSON.stringify(ledger));
        localStorage.setItem('rcp_broken', JSON.stringify(isBroken));
    }

    function calculateHours(start, end) {
        if (!start || !end) return 0;
        let [sH, sM] = start.split(':').map(Number);
        let [eH, eM] = end.split(':').map(Number);
        let diff = (eH * 60 + eM) - (sH * 60 + sM);
        if (diff < 0) diff += 1440; // Overnight
        return diff / 60;
    }

    function addLeg() {
        const leg = {
            id: Date.now(),
            train: document.getElementById('train').value,
            date: document.getElementById('date').value,
            report: document.getElementById('report').value,
            schOff: document.getElementById('schOff').value,
            actOff: document.getElementById('actOff').value || document.getElementById('schOff').value
        };
        
        if (!leg.train || !leg.report) return alert("Fill in Train # and Report Time");
        
        ledger.push(leg);
        save();
        updateUI();
        // Clear inputs
        ['train', 'report', 'schOff', 'actOff'].forEach(id => document.getElementById(id).value = '');
    }

    function deleteLeg(id) {
        ledger = ledger.filter(l => l.id !== id);
        save();
        updateUI();
    }

    function clearData() {
        if(confirm("Delete all entries for this month?")) {
            ledger = [];
            isBroken = false;
            save();
            updateUI();
        }
    }

    function updateUI() {
        isBroken = document.getElementById('breakGuarantee').checked;
        const list = document.getElementById('ledgerList');
        list.innerHTML = '';
        
        let totalActualHours = 0;
        
        ledger.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(leg => {
            const schHrs = calculateHours(leg.report, leg.schOff);
            const actHrs = calculateHours(leg.report, leg.actOff);
            totalActualHours += actHrs;
            
            const diff = (actHrs - schHrs).toFixed(2);
            const diffDisplay = diff > 0 ? `<span class="badge badge-warn">+${diff} Overtime</span>` : '';

            const div = document.createElement('div');
            div.className = 'leg-item';
            div.innerHTML = `
                <button class="delete-btn" onclick="deleteLeg(${leg.id})">×</button>
                <strong>#${leg.train}</strong> <small>${leg.date}</small>
                <div style="font-size: 0.85rem; margin-top:5px;">
                    Report: ${leg.report} | Final: ${leg.actOff} 
                    <span class="badge badge-success">${actHrs.toFixed(2)} Hrs</span>
                    ${diffDisplay}
                </div>
            `;
            list.appendChild(div);
        });

        // Update Stats
        const hoursEl = document.getElementById('monthlyHours');
        const statusPill = document.getElementById('guaranteeStatus');
        const statusMsg = document.getElementById('statusMsg');
        const progressBar = document.getElementById('progressBar');

        document.getElementById('breakGuarantee').checked = isBroken;

        if (isBroken) {
            statusPill.innerText = "GUARANTEE BROKEN";
            statusPill.style.background = var(--accent);
            hoursEl.innerText = `${totalActualHours.toFixed(2)} Actual Hrs`;
            statusMsg.innerText = "Paying actual hours worked only.";
            progressBar.style.width = "100%";
            progressBar.style.background = "var(--muted)";
        } else {
            statusPill.innerText = "QUALIFIED";
            statusPill.style.background = "var(--success)";
            hoursEl.innerText = `${totalActualHours.toFixed(2)} / 185`;
            let remaining = 185 - totalActualHours;
            statusMsg.innerText = remaining > 0 ? `${remaining.toFixed(2)} hours remaining to meet guarantee.` : "Guarantee met! All extra hours are profit.";
            let percent = (totalActualHours / 185) * 100;
            progressBar.style.width = Math.min(percent, 100) + "%";
            progressBar.style.background = "var(--success)";
        }
        save();
    }

    // Initialize date
    document.getElementById('date').valueAsDate = new Date();
    updateUI();
</script>

</body>
</html>
