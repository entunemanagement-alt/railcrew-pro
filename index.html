<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Pro Ultimate</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#06101d;
  color:white;
  padding:15px 15px 90px;
}

.card{
  background:#10233f;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
}

h2{margin:0 0 10px}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#ef4444;
  color:white;
  font-weight:bold;
  margin-top:8px;
}

input,select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-bottom:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.big{
  font-size:22px;
  font-weight:bold;
}

.small{color:#94a3b8;font-size:12px}

.nav{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  display:flex;
  gap:5px;
}

.nav button{
  flex:1;
  font-size:12px;
  background:#1e293b;
}
.active{background:#ef4444 !important}
.page{display:none}
.page.active{display:block}
</style>
</head>

<body>

<div id="home" class="page active">
<div class="card">
<h2>Home</h2>

<div class="big" id="nextMove">No Schedule</div>
<div id="countdown" class="big">--</div>
<div class="small" id="countLabel"></div>

<div class="grid">
<div class="card"><div class="small">Train</div><div id="train">--</div></div>
<div class="card"><div class="small">Status</div><div id="status">--</div></div>
<div class="card"><div class="small">Next Time</div><div id="nextTime">--</div></div>
<div class="card"><div class="small">Gate</div><div id="gate">--</div></div>
<div class="card"><div class="small">Hours</div><div id="hours">0</div></div>
<div class="card"><div class="small">Pay</div><div id="pay">$0</div></div>
</div>

</div>
</div>

<div id="today" class="page">
<div class="card">
<h2>Today</h2>
<div id="todayInfo"></div>
</div>
</div>

<div id="template" class="page">
<div class="card">
<h2>Weekly Template</h2>
<button onclick="loadDefault()">Load My Schedule</button>
</div>
</div>

<div id="month" class="page">
<div class="card">
<h2>Build Month</h2>
<input type="month" id="monthPick">
<button onclick="buildMonth()">Build</button>
</div>
</div>

<div id="payPage" class="page">
<div class="card">
<h2>Pay</h2>
<div>Total Hours: <span id="payHours">0</span></div>
<div>OT: <span id="payOT">0</span></div>
<div>Total: <span id="payTotal">$0</span></div>
</div>
</div>

<div class="nav">
<button onclick="show('home')" id="navhome" class="active">Home</button>
<button onclick="show('today')" id="navtoday">Today</button>
<button onclick="show('template')" id="navtemplate">Template</button>
<button onclick="show('month')" id="navmonth">Month</button>
<button onclick="show('payPage')" id="navpayPage">Pay</button>
</div>

<script>

let template=[]
let monthDays=[]

function show(p){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'))
document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'))
document.getElementById(p).classList.add('active')
document.getElementById('nav'+p).classList.add('active')
}

function loadDefault(){

template=[
{day:1,type:"Off"},
{day:2,type:"Off"},
{day:3,type:"Work",legs:[
{train:"93",report:"13:00",depart:"13:00",release:"17:25"},
{train:"2124",report:"17:25",depart:"17:25",release:"21:20"}
]},
{day:4,type:"Work",legs:[
{train:"93",report:"13:00",depart:"13:00",release:"17:25"},
{train:"2124",report:"17:25",depart:"17:25",release:"21:20"}
]},
{day:5,type:"Work",legs:[
{train:"95",report:"09:35",depart:"09:35",release:"14:05"},
{train:"148",report:"14:05",depart:"14:05",release:"18:27"}
]},
{day:6,type:"Work",legs:[
{train:"153",report:"07:05",depart:"07:05",release:"11:32"},
{train:"140",report:"11:32",depart:"11:32",release:"15:51"}
]},
{day:0,type:"Work",legs:[
{train:"143",report:"08:47",depart:"08:47",release:"13:24"},
{train:"2258",report:"13:24",depart:"13:24",release:"19:05"}
]}
]

alert("Schedule Loaded")
}

function buildMonth(){
let m=document.getElementById("monthPick").value
if(!m)return

monthDays=[]
let [y,mo]=m.split('-')
let days=new Date(y,mo,0).getDate()

for(let i=1;i<=days;i++){
let d=new Date(y,mo-1,i)
let wd=d.getDay()
let t=template.find(x=>x.day==wd)
monthDays.push({
date:`${m}-${String(i).padStart(2,'0')}`,
type:t.type,
legs:t.legs||[]
})
}

alert("Month Built")
}

function nowMins(){
let d=new Date()
return d.getHours()*60+d.getMinutes()
}

function toMin(t){
let [h,m]=t.split(':')
return h*60+ +m
}

function update(){

let today=new Date().toISOString().slice(0,10)
let day=monthDays.find(d=>d.date==today)

if(!day){document.getElementById("nextMove").innerText="No Month Built";return}

if(day.type!="Work"){
document.getElementById("nextMove").innerText="OFF DAY"
return
}

let now=nowMins()

for(let leg of day.legs){

let r=toMin(leg.report)
let d=toMin(leg.depart)
let rel=toMin(leg.release)

if(now<r){
document.getElementById("nextMove").innerText="Report "+leg.train
document.getElementById("countdown").innerText=(r-now)+" min"
return
}

if(now>=r && now<d){
document.getElementById("nextMove").innerText="Board "+leg.train
document.getElementById("countdown").innerText=(d-now)+" min"
return
}

if(now>=d && now<=rel){
document.getElementById("nextMove").innerText="On Train "+leg.train
document.getElementById("countdown").innerText=(rel-now)+" min"
return
}

}

document.getElementById("nextMove").innerText="Released"

}

setInterval(update,10000)

</script>

</body>
</html>
