<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew Pro v29</title>
<style>
body{font-family:Arial;background:#0b1220;color:white;margin:0;padding:15px}
.card{background:#121a2b;padding:15px;border-radius:12px;margin-bottom:12px}
button{padding:10px;border:none;border-radius:8px;margin:5px}
.red{background:#ef4444;color:white}
.blue{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
input{width:100%;padding:8px;margin:5px 0;border-radius:6px}
</style>
</head>
<body>

<h2>RailCrew Pro v29</h2>

<div class="card">
<h3>Quick Check</h3>
<button class="blue" onclick="window.open('https://www.amtrak.com/track-your-train.html')">Amtrak</button>
<button class="blue" onclick="window.open('https://asm.transitdocs.com/')">TransitDocs</button>
</div>

<div class="card">
<h3>Today</h3>
<label>Report Time</label>
<input type="time" id="report">

<label>Station Time</label>
<input type="time" id="station">

<label>Off Time</label>
<input type="time" id="off">

<label>Delay (min)</label>
<input type="number" id="delay">

<button class="green" onclick="setNow()">End Shift Now</button>
</div>

<div class="card">
<h3>Meals</h3>
<label><input type="checkbox" id="breakfast"> Breakfast</label><br>
<label><input type="checkbox" id="lunch"> Lunch</label><br>
<label><input type="checkbox" id="dinner"> Dinner</label><br>
<label><input type="checkbox" id="custom"> Custom Meal</label>
</div>

<div class="card">
<h3>Actions</h3>
<button class="red" onclick="save()">Save Day</button>
<button onclick="load()">Load</button>
</div>

<script>
function setNow(){
 let now=new Date();
 let h=String(now.getHours()).padStart(2,'0');
 let m=String(now.getMinutes()).padStart(2,'0');
 document.getElementById("off").value=h+":"+m;
}

function save(){
 let data={
  report:report.value,
  station:station.value,
  off:off.value,
  delay:delay.value,
  meals:{
    breakfast:breakfast.checked,
    lunch:lunch.checked,
    dinner:dinner.checked,
    custom:custom.checked
  }
 };
 localStorage.setItem("railcrew_v29",JSON.stringify(data));
 alert("Saved");
}

function load(){
 let data=JSON.parse(localStorage.getItem("railcrew_v29"));
 if(!data) return;
 report.value=data.report;
 station.value=data.station;
 off.value=data.off;
 delay.value=data.delay;
 breakfast.checked=data.meals.breakfast;
 lunch.checked=data.meals.lunch;
 dinner.checked=data.meals.dinner;
 custom.checked=data.meals.custom;
}
</script>

</body>
</html>
