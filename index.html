<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailCrew Weekly Scheduler</title>
  <style>
    :root{
      --bg:#071321;
      --card:#13233d;
      --text:#f8fafc;
      --muted:#94a3b8;
      --accent:#ef4444;
      --work:#22c55e;
      --off:#64748b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:linear-gradient(#091626,#071321);
      color:var(--text);
      padding:16px;
    }
    .app{max-width:1100px;margin:0 auto}
    .card{
      background:var(--card);
      border-radius:12px;
      padding:16px;
      margin-bottom:16px;
      border:1px solid rgba(255,255,255,.06);
    }
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .col{
      flex:1;
      min-width:160px;
    }
    label{
      display:block;
      font-size:.85rem;
      color:var(--muted);
      margin-bottom:4px;
    }
    input,select,textarea{
      width:100%;
      padding:10px;
      border:none;
      border-radius:8px;
      background:#0f172a;
      color:white;
    }
    textarea{
      min-height:90px;
      resize:vertical;
    }
    button{
      width:100%;
      padding:10px;
      border:none;
      border-radius:8px;
      background:var(--accent);
      color:white;
      font-weight:bold;
      margin-top:10px;
      cursor:pointer;
    }
    .secondary{background:#334155}
    .green{background:#15803d}
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }
    @media(min-width:900px){
      .grid{grid-template-columns:repeat(4,1fr)}
    }
    .template-grid{
      display:grid;
      grid-template-columns:repeat(1,1fr);
      gap:10px;
    }
    @media(min-width:900px){
      .template-grid{grid-template-columns:repeat(2,1fr)}
    }
    .tile{
      background:#1e293b;
      border-left:5px solid var(--off);
      border-radius:10px;
      padding:12px;
    }
    .tile.work{border-left-color:var(--work)}
    .small{
      color:var(--muted);
      font-size:.85rem;
      margin-top:4px;
    }
    .title{
      margin:0 0 6px 0;
    }
    .leg{
      margin-top:10px;
      padding:10px;
      border-radius:10px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
    }
  </style>
</head>
<body>
<div class="app">

  <div class="card">
    <h2 class="title">RailCrew Weekly Scheduler</h2>
    <div class="small">Set Monday through Sunday once. The app repeats it until you change it.</div>
  </div>

  <div class="card">
    <h3 class="title">1) Month To Build</h3>
    <div class="row">
      <div class="col">
        <label>Month</label>
        <input type="month" id="monthPicker">
      </div>
    </div>
    <button onclick="buildMonthFromWeeklyTemplate()">Build Month From Weekly Template</button>
  </div>

  <div class="card">
    <h3 class="title">2) Weekly Template</h3>
    <div class="small">Set up Monday through Sunday one time. This becomes your recurring weekly schedule.</div>
    <div id="weeklyTemplateGrid" class="template-grid"></div>
  </div>

  <div class="card">
    <h3 class="title">3) Edit Weekly Day Template</h3>

    <div class="row">
      <div class="col">
        <label>Weekday</label>
        <select id="templateWeekday" onchange="loadWeekdayTemplate()">
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6">Saturday</option>
          <option value="0">Sunday</option>
        </select>
      </div>
      <div class="col">
        <label>Day Type</label>
        <select id="templateDayType" onchange="toggleTemplateWorkFields()">
          <option value="Work">Work</option>
          <option value="Off">Off</option>
        </select>
      </div>
    </div>

    <div id="templateWorkFields">
      <div class="row">
        <div class="col">
          <label>Train #</label>
          <input id="templateTrain">
        </div>
        <div class="col">
          <label>Route</label>
          <input id="templateRoute">
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Report</label>
          <input type="time" id="templateReport">
        </div>
        <div class="col">
          <label>Release</label>
          <input type="time" id="templateRelease">
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Leg Notes</label>
          <textarea id="templateLegNotes"></textarea>
        </div>
      </div>

      <button class="green" onclick="addTemplateLeg()">Add Leg To Weekly Day</button>
      <div id="templateLegList"></div>
    </div>

    <div class="row">
      <div class="col">
        <label>Weekly Day Notes</label>
        <textarea id="templateDayNotes"></textarea>
      </div>
    </div>

    <button onclick="saveWeeklyTemplateDay()">Save Weekly Template Day</button>
    <button class="secondary" onclick="clearTemplateEditor()">Clear Template Editor</button>
  </div>

  <div class="card">
    <h3 class="title">4) Auto-Filled Month Schedule</h3>
    <div id="monthGrid" class="grid"></div>
  </div>

  <div class="card">
    <h3 class="title">Month Summary</h3>
    <div id="summary"></div>
  </div>

</div>

<script>
const WEEKLY_TEMPLATE_KEY = "railcrew_weekly_template_v1";
const MONTH_KEY = "railcrew_weekly_generated_months_v1";

const WEEKDAY_NAMES = {
  0: "Sunday",
  1: "Monday",
  2: "Tuesday",
  3: "Wednesday",
  4: "Thursday",
  5: "Friday",
  6: "Saturday"
};

let weeklyTemplate = JSON.parse(localStorage.getItem(WEEKLY_TEMPLATE_KEY) || "[]");
let monthDays = JSON.parse(localStorage.getItem(MONTH_KEY) || "[]");
let draftTemplateLegs = [];

function saveAll(){
  localStorage.setItem(WEEKLY_TEMPLATE_KEY, JSON.stringify(weeklyTemplate));
  localStorage.setItem(MONTH_KEY, JSON.stringify(monthDays));
}

function todayISO(){
  const now = new Date();
  const offset = now.getTimezoneOffset();
  return new Date(now.getTime() - offset * 60000).toISOString().split("T")[0];
}

function calcHours(start, end){
  if(!start || !end) return 0;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  let diff = (eh * 60 + em) - (sh * 60 + sm);
  if(diff < 0) diff += 1440;
  return diff / 60;
}

function ensureWeeklyTemplate(){
  if(weeklyTemplate.length !== 7){
    const old = [...weeklyTemplate];
    weeklyTemplate = [];

    for(const weekday of [1,2,3,4,5,6,0]){
      const existing = old.find(x => Number(x.weekday) === weekday);
      weeklyTemplate.push(existing || {
        weekday,
        name: WEEKDAY_NAMES[weekday],
        type: (weekday >= 1 && weekday <= 5) ? "Work" : "Off",
        legs: [],
        notes: ""
      });
    }

    saveAll();
  }
}

function toggleTemplateWorkFields(){
  const isWork = document.getElementById("templateDayType").value === "Work";
  document.getElementById("templateWorkFields").style.display = isWork ? "block" : "none";
}

function renderTemplateLegs(){
  const box = document.getElementById("templateLegList");
  if(!draftTemplateLegs.length){
    box.innerHTML = '<div class="small">No legs added yet.</div>';
    return;
  }

  box.innerHTML = draftTemplateLegs.map((leg, i) => `
    <div class="leg">
      <div><b>Leg ${i + 1}: Train ${leg.train || "--"}</b></div>
      <div class="small">${leg.route || ""}</div>
      <div class="small">${leg.report || "--:--"} - ${leg.release || "--:--"}</div>
      <div class="small">${leg.hours.toFixed(2)} hrs</div>
      ${leg.notes ? `<div class="small">Note: ${leg.notes}</div>` : ""}
      <button class="secondary" onclick="removeTemplateLeg(${i})">Remove Leg</button>
    </div>
  `).join("");
}

function addTemplateLeg(){
  const train = document.getElementById("templateTrain").value.trim();
  const route = document.getElementById("templateRoute").value.trim();
  const report = document.getElementById("templateReport").value;
  const release = document.getElementById("templateRelease").value;
  const notes = document.getElementById("templateLegNotes").value.trim();

  if(!train || !report){
    alert("Enter Train # and Report");
    return;
  }

  draftTemplateLegs.push({
    train,
    route,
    report,
    release,
    notes,
    hours: calcHours(report, release)
  });

  document.getElementById("templateTrain").value = "";
  document.getElementById("templateRoute").value = "";
  document.getElementById("templateReport").value = "";
  document.getElementById("templateRelease").value = "";
  document.getElementById("templateLegNotes").value = "";

  renderTemplateLegs();
}

function removeTemplateLeg(index){
  draftTemplateLegs.splice(index, 1);
  renderTemplateLegs();
}

function loadWeekdayTemplate(){
  const weekday = Number(document.getElementById("templateWeekday").value);
  const day = weeklyTemplate.find(x => Number(x.weekday) === weekday);
  if(!day) return;

  document.getElementById("templateDayType").value = day.type;
  document.getElementById("templateDayNotes").value = day.notes || "";
  draftTemplateLegs = Array.isArray(day.legs) ? [...day.legs] : [];

  toggleTemplateWorkFields();
  renderTemplateLegs();
}

function clearTemplateEditor(){
  document.getElementById("templateWeekday").value = "1";
  document.getElementById("templateDayType").value = "Work";
  document.getElementById("templateTrain").value = "";
  document.getElementById("templateRoute").value = "";
  document.getElementById("templateReport").value = "";
  document.getElementById("templateRelease").value = "";
  document.getElementById("templateLegNotes").value = "";
  document.getElementById("templateDayNotes").value = "";
  draftTemplateLegs = [];
  renderTemplateLegs();
  toggleTemplateWorkFields();
}

function saveWeeklyTemplateDay(){
  ensureWeeklyTemplate();

  const weekday = Number(document.getElementById("templateWeekday").value);
  const type = document.getElementById("templateDayType").value;
  const notes = document.getElementById("templateDayNotes").value.trim();

  const idx = weeklyTemplate.findIndex(x => Number(x.weekday) === weekday);
  if(idx === -1) return;

  weeklyTemplate[idx].type = type;
  weeklyTemplate[idx].notes = notes;
  weeklyTemplate[idx].legs = type === "Work" ? [...draftTemplateLegs] : [];

  saveAll();
  renderWeeklyTemplateGrid();
  alert("Weekly template saved");
}

function renderWeeklyTemplateGrid(){
  ensureWeeklyTemplate();
  const box = document.getElementById("weeklyTemplateGrid");

  box.innerHTML = weeklyTemplate
    .sort((a,b) => {
      const order = [1,2,3,4,5,6,0];
      return order.indexOf(Number(a.weekday)) - order.indexOf(Number(b.weekday));
    })
    .map(day => {
      const totalHours = (day.legs || []).reduce((sum, leg) => sum + Number(leg.hours || 0), 0);
      return `
        <div class="tile ${day.type === "Work" ? "work" : ""}">
          <div><b>${day.name}</b></div>
          <div class="small">${day.type}</div>
          ${day.type === "Work" ? `
            <div class="small">Legs: ${(day.legs || []).length}</div>
            <div class="small">Hours: ${totalHours.toFixed(2)}</div>
            <div class="small">${day.legs[0] ? `First train: ${day.legs[0].train}` : "No legs yet"}</div>
          ` : `
            <div class="small">Off day</div>
          `}
          ${day.notes ? `<div class="small">Note: ${day.notes}</div>` : ""}
          <button onclick="editWeeklyDay(${day.weekday})">Edit ${day.name}</button>
        </div>
      `;
    }).join("");
}

function editWeeklyDay(weekday){
  document.getElementById("templateWeekday").value = String(weekday);
  loadWeekdayTemplate();
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

function buildMonthFromWeeklyTemplate(){
  ensureWeeklyTemplate();

  const month = document.getElementById("monthPicker").value;
  if(!month){
    alert("Pick a month first");
    return;
  }

  const [year, mon] = month.split("-").map(Number);
  const totalDays = new Date(year, mon, 0).getDate();

  const keepOtherMonths = monthDays.filter(d => !d.date.startsWith(month));
  const rebuilt = [];

  for(let i = 1; i <= totalDays; i++){
    const dateObj = new Date(year, mon - 1, i);
    const date = `${month}-${String(i).padStart(2, "0")}`;
    const weekday = dateObj.getDay();

    const templateDay = weeklyTemplate.find(x => Number(x.weekday) === weekday);
    if(!templateDay) continue;

    rebuilt.push({
      date,
      weekday,
      weekdayName: WEEKDAY_NAMES[weekday],
      type: templateDay.type,
      notes: templateDay.notes || "",
      legs: JSON.parse(JSON.stringify(templateDay.legs || [])),
      hours: (templateDay.legs || []).reduce((sum, leg) => sum + Number(leg.hours || 0), 0)
    });
  }

  monthDays = [...keepOtherMonths, ...rebuilt].sort((a,b) => a.date.localeCompare(b.date));
  saveAll();
  renderMonthGrid();
  renderSummary();
  alert("Month built from your weekly recurring schedule");
}

function renderMonthGrid(){
  const month = document.getElementById("monthPicker").value;
  const box = document.getElementById("monthGrid");

  if(!month){
    box.innerHTML = '<div class="small">Pick a month first.</div>';
    return;
  }

  const daysForMonth = monthDays.filter(d => d.date.startsWith(month));
  if(!daysForMonth.length){
    box.innerHTML = '<div class="small">Build month from weekly template first.</div>';
    return;
  }

  box.innerHTML = daysForMonth.map(day => `
    <div class="tile ${day.type === "Work" ? "work" : ""}">
      <div><b>${day.date}</b></div>
      <div class="small">${day.weekdayName}</div>
      <div class="small">${day.type}</div>
      ${day.type === "Work" ? `
        <div class="small">Legs: ${(day.legs || []).length}</div>
        <div class="small">Hours: ${Number(day.hours || 0).toFixed(2)}</div>
        <div class="small">${day.legs[0] ? `First train: ${day.legs[0].train}` : "No legs yet"}</div>
      ` : `
        <div class="small">Off day</div>
      `}
      ${day.notes ? `<div class="small">Note: ${day.notes}</div>` : ""}
    </div>
  `).join("");
}

function renderSummary(){
  const month = document.getElementById("monthPicker").value;
  const daysForMonth = monthDays.filter(d => d.date.startsWith(month));

  const totalHours = daysForMonth.reduce((sum, d) => sum + Number(d.hours || 0), 0);
  const workDays = daysForMonth.filter(d => d.type === "Work").length;
  const offDays = daysForMonth.filter(d => d.type === "Off").length;

  document.getElementById("summary").innerHTML = `
    <div class="small">Work Days: <b>${workDays}</b></div>
    <div class="small">Off Days: <b>${offDays}</b></div>
    <div class="small">Total Hours: <b>${totalHours.toFixed(2)}</b></div>
    <div class="small">Guarantee: <b>${totalHours >= 185 ? "Met" : "Below 185"}</b></div>
  `;
}

(function init(){
  const today = todayISO();
  document.getElementById("monthPicker").value = today.slice(0,7);

  ensureWeeklyTemplate();
  clearTemplateEditor();
  loadWeekdayTemplate();
  renderWeeklyTemplateGrid();
  renderMonthGrid();
  renderSummary();
})();
</script>
</body>
</html>
