<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailCrew v25 FIXED</title>
<style>
body{background:#0b1220;color:white;font-family:Arial;padding:15px}
.card{background:#121a2b;padding:15px;border-radius:10px;margin-bottom:12px}
button{padding:10px;border:none;border-radius:8px;background:red;color:white;margin:4px}
input{width:100%;padding:8px;margin:5px 0}
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0}
.tab{flex:1;padding:12px;text-align:center;background:#111;cursor:pointer}
.active{background:#7f1d1d}
.hidden{display:none}
</style>
</head>
<body>

<div id="home" class="card">Home working</div>

<div id="builder" class="card hidden">
<h3>Day Tabs (FIXED)</h3>
<div id="days"></div>
<div id="dayContent"></div>
</div>

<div id="reminder" class="card hidden">
<label>Reminder Time</label>
<input id="remTime" type="time">
<button onclick="saveReminder()">Save Reminder</button>
<div id="remOut"></div>
</div>

<div class="tabs">
<div class="tab active" onclick="show('home',this)">Home</div>
<div class="tab" onclick="show('builder',this)">Builder</div>
<div class="tab" onclick="show('reminder',this)">Reminder</div>
</div>

<script>
let app = JSON.parse(localStorage.getItem("rc_fix")||"null") || {
days:[{name:"Day 1"},{name:"Day 2"},{name:"Day 3"}],
active:0,
rem:""
};

function save(){localStorage.setItem("rc_fix",JSON.stringify(app));}

function show(id,el){
document.querySelectorAll(".card").forEach(x=>x.classList.add("hidden"))
document.getElementById(id).classList.remove("hidden")
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))
el.classList.add("active")
}

function renderDays(){
let box=document.getElementById("days")
box.innerHTML=""
app.days.forEach((d,i)=>{
let b=document.createElement("button")
b.innerText=d.name
b.onclick=()=>{app.active=i;save();renderDays();renderDay()}
box.appendChild(b)
})
}

function renderDay(){
document.getElementById("dayContent").innerText="Selected "+app.days[app.active].name
}

function saveReminder(){
app.rem=document.getElementById("remTime").value
save()
document.getElementById("remOut").innerText="Saved: "+app.rem
}

renderDays()
renderDay()
if(app.rem){
document.getElementById("remOut").innerText="Saved: "+app.rem
document.getElementById("remTime").value=app.rem
}
</script>

</body>
</html>
